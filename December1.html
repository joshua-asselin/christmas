<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jour 1 - Calendrier de l'Avent</title>

    <!-- Supabase SDK & Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-image: url('https://i.postimg.cc/PxR6NvbB/a2781225b39a14644c5673928f1b8f0b.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif; color: #ffffff !important; overflow-x: hidden;
            padding-bottom: 50px;
        }

        #snow-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 1;
        }

        .page-header {
            position: relative; z-index: 10;
            width: 92%; max-width: 950px; margin-top: 25px; padding: 16px 28px;
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px; text-align: center; backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.2);
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        }

        .header-left { justify-self: start; }
        .header-center { justify-self: center; }
        .header-right { justify-self: end; }

        .page-title {
            font-family: 'Cinzel', serif; font-size: 2.3rem; font-weight: 900; margin: 0;
            background: linear-gradient(135deg, #ffffff 40%, #ffe066 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.85); 
            color: #1c1917 !important; 
            border: 1px solid #ffffff;
            padding: 11px 24px; border-radius: 16px; font-weight: 800; font-size: 0.9rem; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25), 0 2px 5px rgba(0,0,0,0.2);
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-header:hover { 
            background: #ffffff; 
            transform: translateY(-3px) scale(1.03); 
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.5), 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-admin-trigger {
            background: linear-gradient(135deg, #fff3a0, #ffd700);
            border: 1px solid #ffffff; color: #5a3e00 !important;
        }
        .btn-admin-trigger:hover {
            background: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
        }

        .admin-creator-panel {
            position: relative; z-index: 100;
            display: none; width: 92%; max-width: 850px; margin-top: 20px;
            background: rgba(20, 20, 30, 0.92); border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 28px; padding: 30px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }
        .admin-creator-panel.visible { display: block; animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
        .admin-title { font-family: 'Cinzel', serif; color: #ffd700; font-size: 1.3rem; margin: 0; }
        .btn-close-admin { background: transparent; border: none; color: #888; font-size: 1.3rem; cursor: pointer; transition: color 0.2s; }
        .btn-close-admin:hover { color: #fff; }

        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 600; font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control {
            padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.4); color: #fff; font-family: inherit; font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control:focus { outline: none; border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.15); }

        .options-builder { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .option-row { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.03); padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .color-picker { width: 38px; height: 38px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }

        #ui-1-main {
            position: relative; z-index: 10;
            width: 92%; max-width: 950px; margin-top: 35px; display: flex;
            flex-direction: column; align-items: center; text-align: center; gap: 20px;
        }

        .section-badge {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 30px;
            padding: 6px 18px; font-weight: 800; font-size: 0.8rem; letter-spacing: 1.5px;
            text-transform: uppercase; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .main-tagline {
            font-family: 'Cinzel', serif; margin: 0; font-size: 2rem; font-weight: 800;
            letter-spacing: 1px; color: #ffffff; text-shadow: 0 4px 12px rgba(0,0,0,0.7);
        }

        .diff-card-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 100%; margin-top: 10px;
        }

        .diff-card {
            background: rgba(255, 255, 255, 0.18); 
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px; padding: 30px 20px 25px 20px; text-align: center;
            backdrop-filter: blur(14px); cursor: pointer; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 0 15px rgba(255,255,255,0.1);
            position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .diff-card:hover { transform: translateY(-8px) scale(1.02); background: rgba(255, 255, 255, 0.25); }

        .diff-card.easy:hover { border-color: #2ecc71; box-shadow: 0 15px 35px rgba(46, 204, 113, 0.4); }
        .diff-card.medium:hover { border-color: #f39c12; box-shadow: 0 15px 35px rgba(243, 156, 18, 0.4); }
        .diff-card.hard:hover { border-color: #e74c3c; box-shadow: 0 15px 35px rgba(231, 76, 60, 0.4); }

        .diff-title { font-family: 'Cinzel', serif; font-size: 2.1rem; font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .diff-card-footer {
            margin-top: 20px; width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 0.8rem; font-weight: 700;
        }

        .diff-stars { color: #ffd700; letter-spacing: 2px; font-size: 1.1rem; }

        #ui-2-questions {
            position: relative; z-index: 10;
            display: none; width: 92%; max-width: 850px; margin-top: 30px;
            flex-direction: column; align-items: center; gap: 25px;
        }
        #ui-2-questions.visible { display: flex; animation: fadeIn 0.4s ease; }

        .question-card {
            width: 100%; background: rgba(255, 255, 255, 0.18); border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px; padding: 32px; backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative; transition: all 0.3s ease;
        }

        .question-card-top {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
        }

        .question-tag {
            font-size: 0.8rem; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; padding: 6px 16px; border-radius: 20px;
            background: #ffffff; color: #1c1917; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px;
        }

        .btn-delete-q {
            background: rgba(231, 76, 60, 0.85); color: #fff; border: 1px solid #ffffff;
            padding: 6px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-delete-q:hover { background: #e74c3c; transform: scale(1.05); }

        .question-text { font-size: 1.4rem; font-weight: 800; margin-bottom: 25px; line-height: 1.45; color: #ffffff; text-align: left; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        .answers-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%;
        }

        .btn-option {
            padding: 18px 22px; border-radius: 18px; border: 1.5px solid rgba(255, 255, 255, 0.4);
            color: #ffffff; font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: flex; align-items: center; justify-content: flex-start; gap: 12px;
            text-align: left; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            position: relative; overflow: hidden; backdrop-filter: blur(8px);
        }
        .btn-option:hover { transform: translateY(-3px); filter: brightness(1.25); box-shadow: 0 12px 25px rgba(0,0,0,0.35); }
        .btn-option.selected { border-color: #ffffff !important; box-shadow: 0 0 25px rgba(255, 255, 255, 0.8); transform: scale(1.02); }

        .option-shape {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; opacity: 0.9;
        }

        .input-text-answer {
            width: 100%; padding: 18px 20px; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 1.05rem;
            font-family: inherit; margin-bottom: 10px; transition: border-color 0.2s;
        }
        .input-text-answer:focus { outline: none; border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }

        .btn-submit-q {
            background: #ffffff;
            color: #1c1917 !important; border: none; padding: 14px 32px;
            border-radius: 16px; font-weight: 800; font-size: 0.95rem; cursor: pointer;
            margin-top: 10px; transition: all 0.25s ease; box-shadow: 0 8px 20px rgba(255, 255, 255, 0.3);
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-submit-q:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(255, 255, 255, 0.5); background: #f0f0f0; }

        #bravo-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 12, 0.8); backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
            z-index: 99999;
        }
        #bravo-overlay.active { opacity: 1; pointer-events: auto; }

        .bravo-card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transform: scale(0.6); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #bravo-overlay.active .bravo-card { transform: scale(1); }

        .bravo-text {
            font-family: 'Cinzel', serif; font-size: 5rem; font-weight: 900;
            color: #ffffff !important;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.9), 0 0 60px rgba(255, 215, 0, 0.5);
            margin: 0; animation: popText 0.8s infinite alternate ease-in-out;
        }

        @keyframes popText {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

        .bravo-sub { font-size: 1.5rem; font-weight: 700; color: #ffd700; margin-bottom: 25px; }

        @media (max-width: 768px) {
            .diff-card-grid, .answers-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.6rem; }
            .bravo-text { font-size: 3.5rem; }
            .page-header { grid-template-columns: auto 1fr auto; gap: 10px; }
        }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <div class="page-header">
        <div class="header-left">
            <button class="btn-header" onclick="window.location.href='calendrier.html'">⬅️ CALENDRIER</button>
        </div>
        <div class="header-center">
            <h1 class="page-title" id="day-header-title">JOUR 1</h1>
        </div>
        <div class="header-right">
            <button class="btn-header btn-admin-trigger" id="admin-toggle-btn" style="display:none;" onclick="toggleAdminPanel()">👑 CRÉER</button>
        </div>
    </div>

    <div class="admin-creator-panel" id="admin-panel">
        <div class="admin-header">
            <h2 class="admin-title">👑 NOUVELLE QUESTION (ADMIN)</h2>
            <button class="btn-close-admin" onclick="toggleAdminPanel()">✖</button>
        </div>
        <form id="question-form" onsubmit="saveQuestion(event)">
            <div class="form-group">
                <label>Difficulté</label>
                <select class="form-control" id="q-diff">
                    <option value="easy">Facile (Easy)</option>
                    <option value="medium">Moyen (Medium)</option>
                    <option value="hard">Difficile (Hard)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Type de Question</label>
                <select class="form-control" id="q-type" onchange="renderOptionBuilder()">
                    <option value="single_choice">Choix Unique</option>
                    <option value="multiple_choice">Plusieurs Choix de Réponse</option>
                    <option value="short_text">Réponse Écrite Courte</option>
                    <option value="long_text">Réponse Écrite Longue</option>
                </select>
            </div>

            <div class="form-group">
                <label>Texte de la Question</label>
                <textarea class="form-control" id="q-text" rows="2" required placeholder="Ex: Quel est le renne au nez rouge ?"></textarea>
            </div>

            <div id="kahoot-options-container">
                <div class="form-group">
                    <label>Nombre de choix (4 à 10)</label>
                    <input type="number" class="form-control" id="q-opt-count" min="4" max="10" value="4" onchange="renderOptionBuilder()">
                </div>
                <div class="options-builder" id="options-builder-list"></div>
            </div>

            <div class="form-group" id="text-answer-container" style="display:none;">
                <label>Réponse exacte attendue</label>
                <input type="text" class="form-control" id="q-text-correct" placeholder="Entrez la réponse exacte">
            </div>

            <button type="submit" class="btn-header" style="width: 100%; margin-top: 15px; padding: 14px; background: #2ecc71; color:#fff !important; border:none;">💾 SAUVEGARDER LA QUESTION</button>
        </form>
    </div>

    <div id="ui-1-main">
        <div class="section-badge">🎄 ÉPREUVE DU JOUR</div>
        <h2 class="main-tagline">SÉLECTIONNE TA DIFFICULTÉ</h2>
        
        <div class="diff-card-grid">
            <div class="diff-card easy" onclick="loadQuestionsForDiff('easy')">
                <div>
                    <div class="diff-title" style="color:#2ecc71;">EASY</div>
                    <p style="margin:0; color:#ffffff; font-size: 0.9rem; font-weight: 700;">Niveau Facile</p>
                </div>
                <div class="diff-card-footer">
                    <span id="count-easy">0 Questions</span>
                    <span class="diff-stars" id="stars-easy"></span>
                </div>
            </div>
            <div class="diff-card medium" onclick="loadQuestionsForDiff('medium')">
                <div>
                    <div class="diff-title" style="color:#f39c12;">MEDIUM</div>
                    <p style="margin:0; color:#ffffff; font-size: 0.9rem; font-weight: 700;">Niveau Moyen</p>
                </div>
                <div class="diff-card-footer">
                    <span id="count-medium">0 Questions</span>
                    <span class="diff-stars" id="stars-medium"></span>
                </div>
            </div>
            <div class="diff-card hard" onclick="loadQuestionsForDiff('hard')">
                <div>
                    <div class="diff-title" style="color:#e74c3c;">HARD</div>
                    <p style="margin:0; color:#ffffff; font-size: 0.9rem; font-weight: 700;">Niveau Difficile</p>
                </div>
                <div class="diff-card-footer">
                    <span id="count-hard">0 Questions</span>
                    <span class="diff-stars" id="stars-hard"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="ui-2-questions">
        <button class="btn-header" onclick="backToUI1()">⬅️ RETOUR AUX DIFFICULTÉS</button>
        <div id="questions-list" style="width:100%; display:flex; flex-direction:column; gap:25px;"></div>
    </div>

    <div id="bravo-overlay">
        <div class="bravo-card">
            <h1 class="bravo-text">BRAVO !</h1>
            <div class="bravo-sub">EXCELLENTE RÉPONSE !</div>
            <button class="btn-header" style="font-size: 1.1rem; padding: 14px 40px; background: #ffd700; color: #000 !important; font-weight: 800;" onclick="closeBravo()">CONTINUER</button>
        </div>
    </div>

<script>
    // Configuration du Jour (Modifiez cette valeur pour les autres jours)
    const CURRENT_DAY = 1; 
    const TABLE_NAME = 'advent_questions'; 

    const SUPABASE_URL = 'https://frwxwmynjgzbjwwjxscp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyd3h3bXluamd6Ymp3d2p4c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDQ4OTUsImV4cCI6MjEwMDcyMDg5NX0.2Ps0PvrEu0xqyfN1UjAZ2qcPBEZ-ilMYjApi91omQCA';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const ADMIN_EMAILS = ["asselinj24@emm.qc.ca", "josh.asselin15@gmail.com"];
    let currentUserEmail = "";
    let currentDiff = "easy";
    let activeQuestions = [];
    let userProgressMap = {};
    let isAdmin = false;

    const DEFAULT_COLORS = ['#3498db', '#e74c3c', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#e84393', '#d35400', '#00bec4'];
    const OPTION_ICONS = ['▲', '◆', '●', '■', '★', '⬟', '✦', '⬢', '▼', '►'];

    async function initPage() {
        document.getElementById('day-header-title').innerText = `JOUR ${CURRENT_DAY}`;

        if (supabaseClient) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                currentUserEmail = session.user.email.toLowerCase();
            } else {
                currentUserEmail = localStorage.getItem('last_active_email') || "guest@local";
            }

            if (ADMIN_EMAILS.includes(currentUserEmail)) {
                isAdmin = true;
                document.getElementById('admin-toggle-btn').style.display = 'inline-flex';
            }
        }
        renderOptionBuilder();
        await updateDiffCardsInfo();
    }

    async function updateDiffCardsInfo() {
        if (!supabaseClient) return;

        const { data: questions } = await supabaseClient
            .from(TABLE_NAME)
            .select('id, difficulty')
            .eq('day', CURRENT_DAY);

        const { data: progress } = await supabaseClient
            .from('user_progress')
            .select('question_id, completed')
            .eq('user_email', currentUserEmail)
            .eq('day', CURRENT_DAY);

        const completedSet = new Set(
            (progress || []).filter(p => p.completed).map(p => p.question_id)
        );

        ['easy', 'medium', 'hard'].forEach(diff => {
            const diffQuestions = (questions || []).filter(q => q.difficulty === diff);
            const total = diffQuestions.length;
            
            document.getElementById(`count-${diff}`).innerText = `${total} Question${total > 1 ? 's' : ''}`;

            let starsHTML = '';
            diffQuestions.forEach(q => {
                if (completedSet.has(q.id)) {
                    starsHTML += '★';
                } else {
                    starsHTML += '☆';
                }
            });

            document.getElementById(`stars-${diff}`).innerText = starsHTML;
        });
    }

    function toggleAdminPanel() {
        if (!isAdmin) return;
        const panel = document.getElementById('admin-panel');
        panel.classList.toggle('visible');
    }

    function renderOptionBuilder() {
        const type = document.getElementById('q-type').value;
        const container = document.getElementById('kahoot-options-container');
        const textAnswerCont = document.getElementById('text-answer-container');
        const builder = document.getElementById('options-builder-list');

        if (type === 'short_text' || type === 'long_text') {
            container.style.display = 'none';
            textAnswerCont.style.display = 'block';
            return;
        }

        container.style.display = 'block';
        textAnswerCont.style.display = 'none';
        builder.innerHTML = '';

        const count = parseInt(document.getElementById('q-opt-count').value) || 4;

        for (let i = 0; i < count; i++) {
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
                <input type="color" class="color-picker" value="${DEFAULT_COLORS[i % DEFAULT_COLORS.length]}" id="opt-color-${i}">
                <input type="text" class="form-control" style="flex-grow:1;" placeholder="Option ${i+1}" id="opt-text-${i}" required>
                <label style="font-size:0.85rem; cursor:pointer; font-weight:600;"><input type="${type === 'single_choice' ? 'radio' : 'checkbox'}" name="correct-opt" value="${i}"> Correcte</label>
            `;
            builder.appendChild(row);
        }
    }

    async function saveQuestion(e) {
        e.preventDefault();
        if (!isAdmin) return;

        const diff = document.getElementById('q-diff').value;
        const type = document.getElementById('q-type').value;
        const text = document.getElementById('q-text').value;

        let options = [];
        let correctAnswers = [];

        if (type === 'single_choice' || type === 'multiple_choice') {
            const checkboxes = document.querySelectorAll('input[name="correct-opt"]');

            checkboxes.forEach((cb, i) => {
                const optText = document.getElementById(`opt-text-${i}`).value;
                const optColor = document.getElementById(`opt-color-${i}`).value;
                options.push({ text: optText, color: optColor });

                if (cb.checked) {
                    correctAnswers.push(optText);
                }
            });

            if (correctAnswers.length === 0) {
                alert("Veuillez cocher au moins une bonne réponse !");
                return;
            }
        } else {
            correctAnswers.push(document.getElementById('q-text-correct').value.trim());
        }

        const { error } = await supabaseClient
            .from(TABLE_NAME)
            .insert({
                day: CURRENT_DAY,
                difficulty: diff,
                question_type: type,
                question_text: text,
                options: options,
                correct_answers: correctAnswers
            });

        if (error) {
            alert("Erreur lors de la sauvegarde : " + error.message);
        } else {
            alert("Question ajoutée avec succès !");
            document.getElementById('question-form').reset();
            toggleAdminPanel();
            renderOptionBuilder();
            await updateDiffCardsInfo();

            if (document.getElementById('ui-2-questions').classList.contains('visible')) {
                loadQuestionsForDiff(currentDiff);
            }
        }
    }

    async function deleteQuestion(qId) {
        if (!isAdmin) {
            alert("Accès refusé : Seul l'administrateur peut supprimer une question.");
            return;
        }

        if (!confirm("Voulez-vous vraiment supprimer cette question ?")) return;

        const { error } = await supabaseClient
            .from(TABLE_NAME)
            .delete()
            .eq('id', qId);

        if (error) {
            alert("Erreur lors de la suppression : " + error.message);
        } else {
            await updateDiffCardsInfo();
            loadQuestionsForDiff(currentDiff);
        }
    }

    async function loadQuestionsForDiff(diff) {
        currentDiff = diff;
        document.getElementById('ui-1-main').style.display = 'none';
        document.getElementById('ui-2-questions').classList.add('visible');

        const listCont = document.getElementById('questions-list');
        listCont.innerHTML = '<p style="text-align:center; color:#fff;">Chargement des questions...</p>';

        const { data, error } = await supabaseClient
            .from(TABLE_NAME)
            .select('*')
            .eq('day', CURRENT_DAY)
            .eq('difficulty', diff)
            .order('id', { ascending: true });

        const { data: userProg } = await supabaseClient
            .from('user_progress')
            .select('*')
            .eq('user_email', currentUserEmail)
            .eq('day', CURRENT_DAY)
            .eq('difficulty', diff);

        userProgressMap = {};
        if (userProg) {
            userProg.forEach(p => {
                userProgressMap[p.question_id] = p;
            });
        }

        if (error || !data || data.length === 0) {
            listCont.innerHTML = `<p style="text-align:center; color:#fff; margin-top:20px;">Aucune question disponible en niveau ${diff.toUpperCase()} pour aujourd'hui.</p>`;
            return;
        }

        activeQuestions = data;
        listCont.innerHTML = '';

        data.forEach((q, qIndex) => {
            const qBox = document.createElement('div');
            qBox.className = 'question-card';
            
            const prog = userProgressMap[q.id];
            const isCompleted = prog && prog.completed;

            let answerHTML = '';

            if (q.question_type === 'single_choice' || q.question_type === 'multiple_choice') {
                answerHTML = `<div class="answers-grid">`;
                q.options.forEach((opt, idx) => {
                    const icon = OPTION_ICONS[idx % OPTION_ICONS.length];
                    answerHTML += `
                        <button class="btn-option" style="background:${opt.color}44; border-color:${opt.color};" onclick="toggleOptionSelect(this, '${q.question_type}')">
                            <span class="option-shape" style="color:${opt.color};">${icon}</span>
                            <span>${opt.text}</span>
                        </button>
                    `;
                });
                answerHTML += `</div>`;
            } else if (q.question_type === 'short_text') {
                answerHTML = `<input type="text" class="input-text-answer" id="answer-input-${qIndex}" placeholder="Votre réponse...">`;
            } else {
                answerHTML = `<textarea class="input-text-answer" rows="3" id="answer-input-${qIndex}" placeholder="Votre réponse détaillée..."></textarea>`;
            }

            const deleteBtnHTML = isAdmin ? `<button class="btn-delete-q" onclick="deleteQuestion('${q.id}')">🗑️ Supprimer</button>` : '';
            const statusBadge = isCompleted ? `<span style="color:#2ecc71; font-weight:800;">★ Réussie</span>` : `<span style="color:#aaa;">☆ Non réussie</span>`;

            qBox.innerHTML = `
                <div class="question-card-top">
                    <span class="question-tag">QUESTION ${qIndex + 1} • ${statusBadge}</span>
                    ${deleteBtnHTML}
                </div>
                <div class="question-text">${q.question_text}</div>
                ${answerHTML}
                <button class="btn-submit-q" onclick="validateAnswer(${qIndex})">Valider ma réponse</button>
            `;

            listCont.appendChild(qBox);
        });
    }

    function toggleOptionSelect(btn, type) {
        const parent = btn.parentElement;
        if (type === 'single_choice') {
            parent.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        } else {
            btn.classList.toggle('selected');
        }
    }

    async function validateAnswer(qIndex) {
        const q = activeQuestions[qIndex];
        let isCorrect = false;

        if (q.question_type === 'single_choice' || q.question_type === 'multiple_choice') {
            const qCard = document.querySelectorAll('.question-card')[qIndex];
            const selectedBtns = qCard.querySelectorAll('.btn-option.selected');
            const userAns = Array.from(selectedBtns).map(b => b.querySelector('span:nth-child(2)').innerText.trim());

            if (userAns.length === q.correct_answers.length && userAns.every(val => q.correct_answers.includes(val))) {
                isCorrect = true;
            }
        } else {
            const inputVal = document.getElementById(`answer-input-${qIndex}`).value.trim().toLowerCase();
            if (q.correct_answers.some(ans => ans.toLowerCase() === inputVal)) {
                isCorrect = true;
            }
        }

        const currentProg = userProgressMap[q.id] || { attempts: 0, completed: false };
        
        // Bloquer l'incrémentation du nombre d'essais si la question est déjà réussie
        const newAttempts = currentProg.completed ? currentProg.attempts : currentProg.attempts + 1;
        const newlyCompleted = currentProg.completed || isCorrect;

        if (supabaseClient) {
            await supabaseClient.from('user_progress').upsert({
                user_email: currentUserEmail,
                day: CURRENT_DAY,
                difficulty: q.difficulty,
                question_id: q.id,
                attempts: newAttempts,
                completed: newlyCompleted,
                updated_at: new Date().toISOString()
            }, { onConflict: 'user_email,day,difficulty,question_id' });
        }

        userProgressMap[q.id] = { attempts: newAttempts, completed: newlyCompleted };

        if (isCorrect) {
            triggerBravoAnimation(q.difficulty);
            await updateDiffCardsInfo();
            loadQuestionsForDiff(currentDiff);
        } else {
            alert(`Oups ! Mauvaise réponse. Tentative #${newAttempts}. Réessaie encore !`);
        }
    }

    function triggerBravoAnimation(diff) {
        document.getElementById('bravo-overlay').classList.add('active');

        const defaultOptions = { zIndex: 999999 };

        if (diff === 'easy') {
            confetti({ ...defaultOptions, particleCount: 50, spread: 70, origin: { y: 0.6 } });
        } else if (diff === 'medium') {
            confetti({ ...defaultOptions, particleCount: 100, spread: 100, origin: { y: 0.5 } });
        } else if (diff === 'hard') {
            const duration = 4 * 1000;
            const end = Date.now() + duration;

            const interval = setInterval(() => {
                if (Date.now() > end) return clearInterval(interval);
                confetti({ ...defaultOptions, particleCount: 60, startVelocity: 35, spread: 360, origin: { x: Math.random(), y: Math.random() - 0.2 } });
            }, 180);
        }
    }

    function closeBravo() {
        document.getElementById('bravo-overlay').classList.remove('active');
    }

    async function backToUI1() {
        document.getElementById('ui-2-questions').classList.remove('visible');
        document.getElementById('ui-1-main').style.display = 'flex';
        await updateDiffCardsInfo();
    }

    // Effet de neige
    function initSnow() {
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const flakes = [];

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        for (let i = 0; i < 60; i++) {
            flakes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 3 + 1,
                d: Math.random() * 1 + 0.5
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            ctx.beginPath();
            for (let i = 0; i < flakes.length; i++) {
                const f = flakes[i];
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            updateSnow();
        }

        function updateSnow() {
            for (let i = 0; i < flakes.length; i++) {
                const f = flakes[i];
                f.y += f.d;
                if (f.y > height) {
                    flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d };
                }
            }
        }

        setInterval(drawSnow, 30);
    }

    window.addEventListener('DOMContentLoaded', () => {
        initPage();
        initSnow();
    });
</script>
