<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les 300 Défis de Noël</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@300;400;600&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: url('https://i.postimg.cc/rFB7TZN4/pngtree-christmas-background-vector-illustration-space-for-writing-text-picture-image-16035994-(1).png');
            background-size: cover; background-position: center;
            font-family: 'Poppins', sans-serif;
        }

        /* --- ÉCRAN DE CONNEXION GOOGLE AMÉLIORÉ --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(20, 5, 8, 0.82) 0%, rgba(5, 1, 2, 0.94) 100%);
            backdrop-filter: blur(12px);
            z-index: 1000; display: flex; justify-content: center; align-items: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card {
            background: rgba(45, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.8rem 2.2rem; border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.85), 0 0 40px rgba(212, 160, 23, 0.25), inset 0 1px 1px rgba(255,255,255,0.2);
            text-align: center; max-width: 400px; width: 85%;
            border: 1.5px solid rgba(212, 160, 23, 0.6); color: white;
            position: relative;
            animation: floatCard 5s ease-in-out infinite, cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card::before {
            content: "✉️ 🎄 ✨";
            font-size: 1.8rem;
            display: block;
            margin-bottom: 8px;
        }

        .login-card h1 {
            font-size: 2rem; margin-top: 0; margin-bottom: 10px;
            color: #f7d070; font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(212, 160, 23, 0.3);
        }

        .login-card p {
            color: #e0d0c0; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.55;
            font-weight: 300;
        }

        .btn-google {
            background: #ffffff;
            color: #222; border: 1.5px solid rgba(212, 160, 23, 0.6);
            padding: 12px 24px; font-size: 1rem; font-weight: 600;
            border-radius: 50px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 12px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-google:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(247, 208, 112, 0.5);
            border-color: #f7d070;
        }

        /* --- EN-TÊTE PROFIL UTILISATEUR --- */
        #user-header {
            position: absolute; top: 20px; right: 25px; display: none;
            align-items: center; gap: 12px; background: rgba(30, 5, 10, 0.75);
            backdrop-filter: blur(10px); padding: 6px 16px; border-radius: 40px;
            color: #fce8b2; z-index: 100; border: 1px solid rgba(212, 160, 23, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: fadeInDown 0.6s ease;
        }

        .avatar-img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid #d4a017; }
        .avatar-circle {
            width: 34px; height: 34px; border-radius: 50%; background: #900c1c;
            color: #f7d070; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 15px; border: 1.5px solid #d4a017;
        }

        .btn-header-logout {
            background: linear-gradient(135deg, #d4a017, #aa7c11); color: #200407; border: none; padding: 6px 14px;
            border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
            transition: all 0.3s ease; margin-left: 5px;
        }
        .btn-header-logout:hover { transform: scale(1.08); box-shadow: 0 0 10px rgba(212, 160, 23, 0.6); }

        /* --- PARCHEMIN ET JEU --- */
        .container { position: relative; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }

        .parchemin-img {
            height: 98vh;
            width: 82vw;
            max-width: 1100px;
            object-fit: fill; 
            filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.6));
            transition: all 0.5s ease;
        }

        .scroll-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 55%; 
            height: 62%; overflow-y: scroll; padding: 10px 20px;
            text-align: center; font-family: 'Cinzel', serif;
            scrollbar-width: none; -ms-overflow-style: none; z-index: 5;
        }
        .scroll-box::-webkit-scrollbar { display: none; }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 2.2rem; color: #800c19; cursor: pointer;
            background: rgba(255, 252, 245, 0.85); border-radius: 50%;
            width: 52px; height: 52px; display: flex; justify-content: center; align-items: center;
            z-index: 10; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid #800c19; user-select: none; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .nav-arrow:hover { background: #ffffff; transform: translateY(-50%) scale(1.15); color: #d4a017; border-color: #d4a017; box-shadow: 0 0 15px rgba(212, 160, 23, 0.5); }
        .arrow-left { left: 4vw; } .arrow-right { right: 4vw; }

        h1 { font-size: 2.1rem; margin-bottom: 20px; text-shadow: 1px 1px 0px rgba(255,255,255,0.8); transition: color 0.5s ease; letter-spacing: 1px; }

        .titre-or {
            color: #d4a017; font-size: 2.2rem; font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2), 0 0 15px rgba(212, 160, 23, 0.4);
            margin-bottom: 10px;
        }

        /* BOUTONS COMPACTS & DYNAMIQUES */
        .btn-question {
            display: block; 
            width: 75%; 
            max-width: 360px;
            margin: 8px auto; 
            padding: 10px 16px;
            background: linear-gradient(180deg, #fceecb 0%, #e8d098 100%) !important; 
            color: #3d240b; border: 1.5px solid #a3723f;
            border-radius: 12px; font-size: 0.95rem; font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .btn-question:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .btn-question:active { transform: translateY(0) scale(0.98); }
        
        .btn-silver { border-color: #999; }
        .btn-silver:hover { background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%) !important; }
        .btn-green { border-color: #2d5a27; }
        .btn-green:hover { background: #2d5a27 !important; color: white; }
        .btn-gold { border-color: #d4a017; }
        .btn-gold:hover { background: #d4a017 !important; color: white; }
        .btn-red { border-color: #b30000; }
        .btn-red:hover { background: #b30000 !important; color: white; }

        .btn-question.completed { opacity: 0.6; background: #cbb290 !important; cursor: default; box-shadow: none !important; transform: none !important; }
        .btn-question.completed::after { content: " ✨"; }

        /* VUES ET TRANSITIONS */
        .view-section { display: none; flex-direction: column; align-items: center; opacity: 0; }
        .active-view { display: flex; opacity: 1; animation: smoothSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        #question-view {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            justify-content: center; align-items: center; z-index: 20;
        }
        .question-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50%; text-align: center; font-family: 'Cinzel', serif; color: #3d240b;
            animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .answer-input { 
            padding: 10px 16px; width: 75%; border-radius: 10px; border: 1.5px solid #8e5a31; 
            margin: 15px 0; font-size: 1rem; text-align: center; background: #fffdf8;
            font-family: 'Poppins', sans-serif;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08); transition: all 0.3s ease;
        }
        .answer-input:focus { outline: none; border-color: #d4a017; box-shadow: 0 0 10px rgba(212, 160, 23, 0.4); }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 80%; margin: 0 auto; }
        .btn-action {
            width: 100%; padding: 10px 0; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif;
            font-size: 0.9rem; transition: all 0.3s ease; box-shadow: 0 4px 8px rgba(0,0,0,0.12);
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.2); }

        .btn-check { background: #2d5a27; color: white; }
        .btn-back { background: #900c1c; color: white; }
        .btn-show { background: #d4a017; color: white; display: none; }
        .btn-regen { background: #ffffff; color: #3d240b; display: none; }

        #hint-text { display: block; height: 1.2rem; margin-top: 5px; font-weight: bold; color: #b30000; visibility: hidden; font-family: 'Poppins', sans-serif; font-size: 0.9rem; }

        .theme-vert h1 { color: #2d5a27; }
        .theme-or h1 { color: #d4a017; }
        .theme-rouge h1 { color: #900c1c; }
        .theme-menu h1 { color: #555555; }

        /* ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardEntrance { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes smoothSlideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: translate(-50%, -46%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body class="theme-menu">

<div id="login-overlay">
    <div class="login-card">
        <h1>Lettre de Noël</h1>
        <p>Connecte-toi avec ton compte Google pour que l'administrateur puisse t'envoyer ta lettre de Noël personnalisée et t'entraîner aux défis !</p>
        <button onclick="loginWithGoogle()" class="btn-google">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google">
            Se connecter avec Google
        </button>
    </div>
</div>

<div id="user-header">
    <div id="user-avatar-slot"></div>
    <span id="user-name-slot" style="font-weight: 500; font-size: 0.9rem;"></span>
    <button onclick="logout()" class="btn-header-logout">Déconnexion</button>
</div>

<div class="container" id="main-container">
    <div id="list-view">
        <div id="nav-arrows" style="display: none;">
            <div class="nav-arrow arrow-left" id="btn-arrow-L">❮</div>
            <div class="nav-arrow arrow-right" id="btn-arrow-R">❯</div>
        </div>

        <img id="main-scroll-bg" src="https://i.postimg.cc/RhR1YFdd/pngtree-vintage-scroll-banner-illustration-png-image-16419425-removebg-preview.png" class="parchemin-img">
        
        <div class="scroll-box">
            
            <div id="view-main-menu" class="view-section active-view">
                <h1>MENU PRINCIPAL</h1>
                <button class="btn-question btn-silver" onclick="showSubMenu('questions')">🎁 QUESTIONS</button>
                <button class="btn-question btn-silver" onclick="showSubMenu('avantages')">✨ AVANTAGES</button>
            </div>

            <div id="view-submenu-questions" class="view-section">
                <h1>CHOISIR UN NIVEAU</h1>
                <button class="btn-question btn-green" onclick="goToLevel(0)">🟢 DÉFIS FACILES</button>
                <button class="btn-question btn-gold" onclick="goToLevel(1)">🟡 DÉFIS MOYENS</button>
                <button class="btn-question btn-red" onclick="goToLevel(2)">🔴 DÉFIS DIFFICILES</button>
                <button class="btn-question btn-silver" onclick="devUnlock()">🔓 DEV UNLOCK</button>
                <button class="btn-question btn-silver" style="margin-top:15px;" onclick="backToMain()">RETOUR</button>
            </div>

            <div id="view-submenu-avantages" class="view-section">
                <h1 id="avantage-title" class="titre-or">AVANTAGE 1</h1>
                <img id="avantage-scroll-img" src="https://i.postimg.cc/mrYm0SXf/Capture-d-e-cran-le-2026-02-09-a-17-25-24-removebg-preview.png" style="width: 100%; max-width: 500px; filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.4)); border-radius: 8px;">
                <button class="btn-question btn-silver" style="margin-top:15px;" onclick="backToMain()">RETOUR</button>
            </div>

            <div id="view-questions-list" class="view-section">
                <h1 id="level-title">📜 LISTE</h1>
                <div id="questions-container-inner" style="width: 100%;"></div>
                <button class="btn-question btn-silver" style="margin-top:15px;" onclick="backToMain()">🏠 MENU PRINCIPAL</button>
            </div>

        </div>
    </div>

    <div id="question-view">
        <img src="https://i.postimg.cc/RhR1YFdd/pngtree-vintage-scroll-banner-illustration-png-image-16419425-removebg-preview.png" class="parchemin-img">
        <div class="question-container">
            <h2 id="current-q-text" style="font-size: 1.3rem; line-height: 1.4;">...</h2>
            <div id="hint-text">REPONSE ICI</div>
            <input type="text" id="user-ans-input" class="answer-input" placeholder="Ta réponse..." autocomplete="off">
            <div class="action-grid">
                <button id="btn-show-id" class="btn-action btn-show" onclick="revealHint()">Voir la réponse</button>
                <button id="btn-regen-id" class="btn-action btn-regen" onclick="regenerateAi()">Régénérer</button>
                <button class="btn-action btn-check" onclick="checkAnswer()">Valider</button>
                <button class="btn-action btn-back" onclick="hideQuestion()">Retour</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- GESTION DE L'AUTHENTIFICATION SUPABASE ---
    const SUPABASE_URL = 'https://frwxwmynjgzbjwwjxscp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyd3h3bXluamd6Ymp3d2p4c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDQ4OTUsImV4cCI6MjEwMDcyMDg5NX0.2Ps0PvrEu0xqyfN1UjAZ2qcPBEZ-ilMYjApi91omQCA';

    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    async function loginWithGoogle() {
      if (!supabaseClient) return alert("Erreur de chargement du module Supabase");
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: 'https://christmasss2026.vercel.app'
        }
      });
      if (error) alert("Erreur de connexion : " + error.message);
    }

    async function logout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        window.location.reload();
      }
    }

    function handleSession(session) {
      const overlay = document.getElementById('login-overlay');
      const userHeader = document.getElementById('user-header');

      if (session) {
        if (overlay) overlay.style.display = 'none';
        if (userHeader) userHeader.style.display = 'flex';

        const user = session.user;
        const metadata = user.user_metadata || {};
        const name = metadata.full_name || metadata.name || user.email || 'Joueur';
        const avatarUrl = metadata.avatar_url || metadata.picture;

        document.getElementById('user-name-slot').innerText = name;
        const avatarSlot = document.getElementById('user-avatar-slot');

        if (avatarUrl) {
          avatarSlot.innerHTML = `<img src="${avatarUrl}" class="avatar-img" alt="Avatar">`;
        } else {
          avatarSlot.innerHTML = `<div class="avatar-circle">${name.charAt(0).toUpperCase()}</div>`;
        }
      } else {
        if (overlay) overlay.style.display = 'flex';
        if (userHeader) userHeader.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!supabaseClient) return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      handleSession(session);

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        handleSession(session);
      });
    });

    // --- LES 300 QUESTIONS FIXES ---
    const allData = [
       /* Tes questions ici */
    ];

    let currentLevel = 0;
    let currentAvantage = 1;
    let activeIndex = -1;
    let isAiMode = false;
    let currentAiQ = ["", ""];

    const levels = [
        { name: "DÉFIS FACILES", class: "theme-vert", btnClass: "btn-green", start: 0 },
        { name: "DÉFIS MOYENS", class: "theme-or", btnClass: "btn-gold", start: 100 },
        { name: "DÉFIS DIFFICILES", class: "theme-rouge", btnClass: "btn-red", start: 200 }
    ];

    function normalize(str) {
        if(!str) return "";
        return str.toString().toLowerCase()
            .replace(/[éèêë]/g, 'e').replace(/[àâ]/g, 'a').replace(/[îï]/g, 'i').replace(/[ôö]/g, 'o').replace(/[ûù]/g, 'u')
            .replace(/^(le |la |les |l\'|un |une |des )/, "")
            .replace(/\s/g, "").trim();
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
        document.getElementById(viewId).classList.add('active-view');
        
        const nav = document.getElementById('nav-arrows');
        const bg = document.getElementById('main-scroll-bg');
        const arrowL = document.getElementById('btn-arrow-L');
        const arrowR = document.getElementById('btn-arrow-R');

        if (viewId === 'view-questions-list') {
            nav.style.display = 'block';
            bg.style.opacity = "1";
            arrowL.onclick = () => changeLevel(-1);
            arrowR.onclick = () => changeLevel(1);
        } 
        else if (viewId === 'view-submenu-avantages') {
            nav.style.display = 'block';
            bg.style.opacity = "0";
            arrowL.onclick = () => moveAvantage(-1);
            arrowR.onclick = () => moveAvantage(1);
            updateAvantageUI();
        }
        else {
            nav.style.display = 'none';
            bg.style.opacity = "1";
        }
        document.querySelector('.scroll-box').scrollTop = 0;
    }

    function moveAvantage(dir) {
        currentAvantage += dir;
        if(currentAvantage < 1) currentAvantage = 20;
        if(currentAvantage > 20) currentAvantage = 1;
        updateAvantageUI();
    }

    function updateAvantageUI() {
        document.getElementById('avantage-title').innerText = "AVANTAGE " + currentAvantage;
    }

    function showSubMenu(type) {
        document.body.className = "theme-menu";
        if(type === 'questions') switchView('view-submenu-questions');
        if(type === 'avantages') switchView('view-submenu-avantages');
    }

    function backToMain() {
        document.body.className = "theme-menu";
        switchView('view-main-menu');
    }

    function goToLevel(idx) {
        currentLevel = idx;
        renderQuestionsList();
        switchView('view-questions-list');
    }

    function renderQuestionsList() {
        const listInner = document.getElementById('questions-container-inner');
        const level = levels[currentLevel];
        document.getElementById('level-title').innerText = "📜 " + level.name;
        document.body.className = level.class;
        listInner.innerHTML = "";
        
        const solved = JSON.parse(localStorage.getItem('noel_solved') || "[]");

        for (let i = 1; i <= 100; i++) {
            const qID = level.start + i - 1;
            const isDone = solved.includes(qID);
            let btn = document.createElement('button');
            btn.className = `btn-question ${level.btnClass} ${isDone ? 'completed' : ''}`;
            btn.innerText = isDone ? `DÉFI RÉUSSI` : `QUESTION ${i}`;
            btn.onclick = () => showQuestion(qID, false);
            listInner.appendChild(btn);
        }

        let btnAi = document.createElement('button');
        btnAi.className = `btn-question btn-silver`;
        btnAi.innerText = `QUESTION IA ✨`;
        btnAi.onclick = () => showQuestion(-1, true);
        listInner.appendChild(btnAi);
    }

    function showQuestion(id, isAi) {
        isAiMode = isAi;
        document.getElementById('hint-text').style.visibility = "hidden";
        if (isAi) {
            document.getElementById('btn-show-id').style.display = "block";
            document.getElementById('btn-regen-id').style.display = "block";
            const pool = allData.slice(levels[currentLevel].start, levels[currentLevel].start + 100);
            currentAiQ = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : ["Pas de question", ""];
            document.getElementById('current-q-text').innerText = "[IA] " + currentAiQ[0];
        } else {
            document.getElementById('btn-show-id').style.display = "none";
            document.getElementById('btn-regen-id').style.display = "none";
            activeIndex = id;
            document.getElementById('current-q-text').innerText = allData[id] ? allData[id][0] : "Question vide";
        }
        document.getElementById('user-ans-input').value = "";
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('question-view').style.display = 'flex';
        document.getElementById('user-ans-input').focus();
    }

    function hideQuestion() {
        document.getElementById('question-view').style.display = 'none';
        document.getElementById('list-view').style.display = 'block';
        renderQuestionsList();
    }

    function checkAnswer() {
        const userAns = normalize(document.getElementById('user-ans-input').value);
        const correctAns = normalize(isAiMode ? currentAiQ[1] : (allData[activeIndex] ? allData[activeIndex][1] : ""));
        if (userAns !== "" && userAns === correctAns) {
            alert("Bravo ! ✨");
            if (!isAiMode) {
                let solved = JSON.parse(localStorage.getItem('noel_solved') || "[]");
                if (!solved.includes(activeIndex)) solved.push(activeIndex);
                localStorage.setItem('noel_solved', JSON.stringify(solved));
            }
            hideQuestion();
        } else {
            alert("Oh non ! ❄️");
        }
    }

    function devUnlock() {
        if(confirm("Réinitialiser la progression ?")) {
            localStorage.removeItem('noel_solved');
            alert("Progression réinitialisée !");
        }
    }

    function changeLevel(dir) {
        currentLevel = (currentLevel + dir + 3) % 3;
        renderQuestionsList();
    }

    function revealHint() {
        const hText = document.getElementById('hint-text');
        hText.innerText = currentAiQ[1];
        hText.style.visibility = "visible";
        setTimeout(() => { hText.style.visibility = "hidden"; }, 1000);
    }

    function regenerateAi() { showQuestion(-1, true); }

    document.getElementById('user-ans-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
</script>
</body>
</html>
