<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les 300 Défis de Noël</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: url('https://i.postimg.cc/rFB7TZN4/pngtree-christmas-background-vector-illustration-space-for-writing-text-picture-image-16035994-(1).png');
            background-size: cover; background-position: center;
            font-family: 'Poppins', sans-serif;
        }

        /* --- ÉCRAN DE CONNEXION GOOGLE --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(20, 5, 8, 0.82) 0%, rgba(5, 1, 2, 0.94) 100%);
            backdrop-filter: blur(12px);
            z-index: 1000; display: flex; justify-content: center; align-items: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card {
            background: rgba(45, 10, 15, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 2.8rem 2.2rem; border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.85), 0 0 40px rgba(212, 160, 23, 0.25), inset 0 1px 1px rgba(255,255,255,0.2);
            text-align: center; max-width: 400px; width: 85%;
            border: 1.5px solid rgba(212, 160, 23, 0.6); color: white;
            position: relative;
            animation: floatCard 5s ease-in-out infinite, cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card::before { content: "✉️ 🎄 ✨"; font-size: 1.8rem; display: block; margin-bottom: 8px; }

        .login-card h1 {
            font-size: 2rem; margin-top: 0; margin-bottom: 10px;
            color: #f7d070; font-family: 'Cinzel', serif;
            letter-spacing: 1px; text-shadow: 0 2px 10px rgba(212, 160, 23, 0.3);
        }

        .login-card p { color: #e0d0c0; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.55; font-weight: 300; }

        .btn-google {
            background: #ffffff; color: #222; border: 1.5px solid rgba(212, 160, 23, 0.6);
            padding: 12px 24px; font-size: 1rem; font-weight: 600;
            border-radius: 50px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 12px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); width: 100%; box-sizing: border-box;
        }

        .btn-google:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(247, 208, 112, 0.5);
            border-color: #f7d070;
        }

        /* --- EN-TÊTE PROFIL UTILISATEUR --- */
        #user-header {
            position: absolute; top: 20px; right: 25px; display: none;
            align-items: center; gap: 12px; background: rgba(30, 5, 10, 0.85);
            backdrop-filter: blur(10px); padding: 6px 16px; border-radius: 40px;
            color: #fce8b2; z-index: 100; border: 1px solid rgba(212, 160, 23, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: fadeInDown 0.6s ease;
        }

        .avatar-img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid #d4a017; }
        .avatar-circle {
            width: 34px; height: 34px; border-radius: 50%; background: #900c1c;
            color: #f7d070; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 15px; border: 1.5px solid #d4a017;
        }

        .btn-header-logout {
            background: linear-gradient(135deg, #d4a017, #aa7c11); color: #200407; border: none; padding: 6px 14px;
            border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
            transition: all 0.3s ease; margin-left: 5px;
        }
        .btn-header-logout:hover { transform: scale(1.08); box-shadow: 0 0 10px rgba(212, 160, 23, 0.6); }

        .btn-admin-badge {
            background: linear-gradient(135deg, #e6ac00, #b38600); color: #111; border: none; padding: 5px 12px;
            border-radius: 20px; font-weight: bold; font-size: 0.75rem; cursor: pointer; display: none;
            box-shadow: 0 0 10px rgba(230, 172, 0, 0.6); transition: all 0.2s ease;
        }
        .btn-admin-badge:hover { transform: scale(1.08); }

        /* --- PARCHEMIN ET JEU --- */
        .container { position: relative; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }

        .parchemin-img {
            height: 98vh; width: 82vw; max-width: 1100px; object-fit: fill; 
            filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.6)); transition: all 0.5s ease;
        }

        /* SUPPRESSION VISUELLE DE LA SCROLLBAR */
        .scroll-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 48%; height: 60%; overflow-y: scroll; padding: 10px;
            text-align: center; font-family: 'Cinzel', serif; z-index: 5;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }
        .scroll-box::-webkit-scrollbar { display: none; /* Chrome, Safari, Opera */ }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 2.2rem; color: #800c19; cursor: pointer;
            background: rgba(255, 252, 245, 0.85); border-radius: 50%;
            width: 52px; height: 52px; display: flex; justify-content: center; align-items: center;
            z-index: 10; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid #800c19; user-select: none; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .nav-arrow:hover { background: #ffffff; transform: translateY(-50%) scale(1.15); color: #d4a017; border-color: #d4a017; box-shadow: 0 0 15px rgba(212, 160, 23, 0.5); }
        .arrow-left { left: 4vw; } .arrow-right { right: 4vw; }

        h1 { font-size: 2rem; margin-bottom: 15px; text-shadow: 1px 1px 0px rgba(255,255,255,0.8); transition: color 0.5s ease; letter-spacing: 1px; }

        .titre-or {
            color: #d4a017; font-size: 2rem; font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2), 0 0 15px rgba(212, 160, 23, 0.4); margin-bottom: 10px;
        }

        .btn-question {
            display: block; width: 85%; max-width: 320px; margin: 8px auto; padding: 10px 16px;
            background: linear-gradient(180deg, #fceecb 0%, #e8d098 100%) !important; 
            color: #3d240b; border: 1.5px solid #a3723f; border-radius: 12px; font-size: 0.9rem; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .btn-question:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .btn-question:active { transform: translateY(0) scale(0.98); }
        
        .btn-silver { border-color: #999; }
        .btn-silver:hover { background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%) !important; }
        .btn-green { border-color: #2d5a27; }
        .btn-green:hover { background: #2d5a27 !important; color: white; }
        .btn-gold { border-color: #d4a017; }
        .btn-gold:hover { background: #d4a017 !important; color: white; }
        .btn-red { border-color: #b30000; }
        .btn-red:hover { background: #b30000 !important; color: white; }

        .btn-question.completed { opacity: 0.6; background: #cbb290 !important; cursor: default; box-shadow: none !important; transform: none !important; }
        .btn-question.completed::after { content: " ✨"; }

        /* TEXTE MODIFIÉ : PLUS ÉTROIT POUR RENTRER DANS LE PARCHEMIN SANS DEBORDER */
        .lettre-ancienne {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem; line-height: 1.4; color: #1a0f07;
            text-shadow: 0.5px 0.5px 1px rgba(20, 10, 5, 0.5);
            max-width: 80%; margin: 0 auto; padding: 5px;
            white-space: pre-wrap; word-wrap: break-word; text-align: center;
        }

        .reply-box-container {
            margin-top: 15px; border-top: 1px dashed #a3723f; padding-top: 10px; width: 85%; margin-left: auto; margin-right: auto;
        }

        .reply-textarea {
            width: 100%; height: 70px; border-radius: 8px; border: 1px solid #a3723f;
            background: #fffef8; font-family: 'Poppins', sans-serif; font-size: 0.85rem; padding: 8px;
            resize: none; outline: none; box-sizing: border-box;
        }

        .all-letters-card {
            background: rgba(255, 253, 245, 0.9); border: 1px solid #a3723f;
            border-radius: 10px; padding: 10px; margin-bottom: 12px; text-align: left;
        }

        .view-section { display: none; flex-direction: column; align-items: center; opacity: 0; }
        .active-view { display: flex; opacity: 1; animation: smoothSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        #question-view {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            justify-content: center; align-items: center; z-index: 20;
        }
        .question-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 48%; text-align: center; font-family: 'Cinzel', serif; color: #3d240b;
            animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .answer-input, .admin-textarea, .admin-select { 
            padding: 8px 14px; width: 85%; border-radius: 10px; border: 1.5px solid #8e5a31; 
            margin: 8px 0; font-size: 0.9rem; text-align: center; background: #fffdf8;
            font-family: 'Poppins', sans-serif; box-sizing: border-box;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08); transition: all 0.3s ease;
        }
        .admin-textarea { height: 90px; text-align: left; resize: none; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 85%; margin: 0 auto; }
        .btn-action {
            width: 100%; padding: 8px 0; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; transition: all 0.3s ease; box-shadow: 0 4px 8px rgba(0,0,0,0.12);
        }

        .btn-check { background: #2d5a27; color: white; }
        .btn-back { background: #900c1c; color: white; }
        .btn-show { background: #d4a017; color: white; display: none; }
        .btn-regen { background: #ffffff; color: #3d240b; display: none; }

        #hint-text { display: block; height: 1.2rem; margin-top: 5px; font-weight: bold; color: #b30000; visibility: hidden; font-family: 'Poppins', sans-serif; font-size: 0.85rem; }

        .theme-vert h1 { color: #2d5a27; }
        .theme-or h1 { color: #d4a017; }
        .theme-rouge h1 { color: #900c1c; }
        .theme-menu h1 { color: #555555; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardEntrance { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes smoothSlideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: translate(-50%, -46%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body class="theme-menu">

<div id="login-overlay">
    <div class="login-card">
        <h1>Lettre de Noël</h1>
        <p>Connecte-toi avec Google pour recevoir ta lettre personnalisée du Père Noël et tenter les 300 défis !</p>
        <button onclick="loginWithGoogle()" class="btn-google">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google">

</div>

<div id="user-header">
    <div id="user-avatar-slot"></div>
    <span id="user-name-slot" style="font-weight: 500; font-size: 0.85rem;"></span>
    <button id="btn-admin-header" class="btn-admin-badge" onclick="showAdminPanel()">⚙️ ADMIN</button>
    <button onclick="logout()" class="btn-header-logout">Déconnexion</button>
</div>

<div class="container" id="main-container">
    <div id="list-view">
        <div id="nav-arrows" style="display: none;">
            <div class="nav-arrow arrow-left" id="btn-arrow-L">❮</div>
            <div class="nav-arrow arrow-right" id="btn-arrow-R">❯</div>
        </div>

        <img id="main-scroll-bg" src="https://i.postimg.cc/RhR1YFdd/pngtree-vintage-scroll-banner-illustration-png-image-16419425-removebg-preview.png" class="parchemin-img">
        
        <div class="scroll-box">
            
            <div id="view-main-menu" class="view-section active-view">
                <h1>MENU PRINCIPAL</h1>
                <button class="btn-question btn-silver" onclick="showSubMenu('questions')">🎁 QUESTIONS</button>
                <button class="btn-question btn-silver" onclick="showSubMenu('avantages')">✨ AVANTAGES</button>
                <button class="btn-question btn-gold" onclick="showUserLetter()">✉️ MA LETTRE DE NOËL</button>
                <button id="btn-admin-menu" class="btn-question btn-gold" style="display:none;" onclick="showAdminPanel()">⚙️ PANNEAU ADMIN</button>
            </div>

            <div id="view-submenu-questions" class="view-section">
                <h1>CHOISIR UN NIVEAU</h1>
                <button class="btn-question btn-green" onclick="goToLevel(0)">🟢 DÉFIS FACILES</button>
                <button class="btn-question btn-gold" onclick="goToLevel(1)">🟡 DÉFIS MOYENS</button>
                <button class="btn-question btn-red" onclick="goToLevel(2)">🔴 DÉFIS DIFFICILES</button>
                <button class="btn-question btn-silver" onclick="devUnlock()">🔓 DEV UNLOCK</button>
                <button class="btn-question btn-silver" style="margin-top:10px;" onclick="backToMain()">RETOUR</button>
            </div>

            <div id="view-submenu-avantages" class="view-section">
                <h1 id="avantage-title" class="titre-or">AVANTAGE 1</h1>
                <img id="avantage-scroll-img" src="https://i.postimg.cc/mrYm0SXf/Capture-d-e-cran-le-2026-02-09-a-17-25-24-removebg-preview.png" style="width: 100%; max-width: 450px; filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.4)); border-radius: 8px;">
                <button class="btn-question btn-silver" style="margin-top:10px;" onclick="backToMain()">RETOUR</button>
            </div>

            <div id="view-questions-list" class="view-section">
                <h1 id="level-title">📜 LISTE</h1>
                <div id="questions-container-inner" style="width: 100%;"></div>
                <button class="btn-question btn-silver" style="margin-top:10px;" onclick="backToMain()">🏠 MENU PRINCIPAL</button>
            </div>

            <div id="view-user-letter" class="view-section" onclick="launchConfetti(event)">
                <h1 style="font-family:'Great Vibes', cursive; font-size:2.4rem; color:#800c19; margin-bottom:0;">Lettre de Noël</h1>
                
                <div id="user-letter-content" class="lettre-ancienne">Chargement...</div>
                
                <div class="reply-box-container" onclick="event.stopPropagation();">
                    <p style="font-size:0.75rem; color:#3d240b; margin:2px 0; font-family:'Poppins', sans-serif;">Répondre au Père Noël :</p>
                    <textarea id="user-reply-input" class="reply-textarea" placeholder="Écris ta réponse ici..."></textarea>
                    <button class="btn-question btn-green" style="margin:5px auto; width:100%; font-size:0.8rem; padding:6px;" onclick="sendReplyToAdmin()">✉️ Envoyer ma réponse</button>
                </div>
                
                <button class="btn-question btn-silver" style="margin-top:10px;" onclick="backToMain()">RETOUR</button>
            </div>

            <div id="view-admin-panel" class="view-section">
                <h1 class="titre-or">⚙️ ADMIN</h1>
                
                <button class="btn-question btn-gold" style="margin-bottom:10px;" onclick="toggleAllLettersView()">📜 VOIR / EDITER TOUTES LES LETTRES</button>

                <div id="admin-single-edit">
                    <select id="admin-user-select" class="admin-select" onchange="loadSelectedUserLetter()">
                        <option value="">-- Choisir un destinataire --</option>
                    </select>
                    <textarea id="admin-letter-text" class="admin-textarea" placeholder="Rédige la lettre personnalisée..."></textarea>
                    
                    <div id="admin-view-reply" style="font-family:'Poppins', sans-serif; font-size:0.8rem; color:#800c19; margin:5px 0; font-style:italic;"></div>

                    <button class="btn-question btn-green" onclick="saveLetterForUser()">💾 ENREGISTRER & ENVOYER</button>
                </div>

                <div id="admin-all-letters-list" style="display:none; width:100%;">
                    <h2 style="font-size:1.1rem; color:#3d240b;">Toutes les lettres :</h2>
                    <div id="all-letters-container"></div>
                </div>

                <button class="btn-question btn-silver" style="margin-top:10px;" onclick="backToMain()">RETOUR</button>
            </div>

        </div>
    </div>

    <div id="question-view">
        <img src="https://i.postimg.cc/RhR1YFdd/pngtree-vintage-scroll-banner-illustration-png-image-16419425-removebg-preview.png" class="parchemin-img">
        <div class="question-container">
            <h2 id="current-q-text" style="font-size: 1.2rem; line-height: 1.3;">...</h2>
            <div id="hint-text">REPONSE ICI</div>
            <input type="text" id="user-ans-input" class="answer-input" placeholder="Ta réponse..." autocomplete="off">
            <div class="action-grid">
                <button id="btn-show-id" class="btn-action btn-show" onclick="revealHint()">Voir la réponse</button>
                <button id="btn-regen-id" class="btn-action btn-regen" onclick="regenerateAi()">Régénérer</button>
                <button class="btn-action btn-check" onclick="checkAnswer()">Valider</button>
                <button class="btn-action btn-back" onclick="hideQuestion()">Retour</button>
            </div>
        </div>
    </div>
</div>

<script>
    const ADMIN_EMAILS = ["asselinj24@emm.qc.ca", "josh.asselin15@gmail.com"];
    let currentUserEmail = "";

    const SUPABASE_URL = 'https://frwxwmynjgzbjwwjxscp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyd3h3bXluamd6Ymp3d2p4c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDQ4OTUsImV4cCI6MjEwMDcyMDg5NX0.2Ps0PvrEu0xqyfN1UjAZ2qcPBEZ-ilMYjApi91omQCA';

    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    async function loginWithGoogle() {
      if (!supabaseClient) return alert("Erreur Supabase");
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google', options: { redirectTo: 'https://christmasss2026.vercel.app' }
      });
    }

    async function logout() {
      if (supabaseClient) { await supabaseClient.auth.signOut(); window.location.reload(); }
    }

    function handleSession(session) {
      const overlay = document.getElementById('login-overlay');
      const userHeader = document.getElementById('user-header');

      if (session) {
        if (overlay) overlay.style.display = 'none';
        if (userHeader) userHeader.style.display = 'flex';

        const user = session.user;
        currentUserEmail = user.email || "";
        const metadata = user.user_metadata || {};
        const name = metadata.full_name || metadata.name || currentUserEmail || 'Joueur';
        const avatarUrl = metadata.avatar_url || metadata.picture;

        document.getElementById('user-name-slot').innerText = name;
        const avatarSlot = document.getElementById('user-avatar-slot');

        if (avatarUrl) {
          avatarSlot.innerHTML = `<img src="${avatarUrl}" class="avatar-img" alt="Avatar">`;
        } else {
          avatarSlot.innerHTML = `<div class="avatar-circle">${name.charAt(0).toUpperCase()}</div>`;
        }

        const isAdmin = ADMIN_EMAILS.includes(currentUserEmail.toLowerCase());
        document.getElementById('btn-admin-header').style.display = isAdmin ? 'inline-block' : 'none';
        document.getElementById('btn-admin-menu').style.display = isAdmin ? 'block' : 'none';

        registerUserLocally(currentUserEmail, name);
      } else {
        if (overlay) overlay.style.display = 'flex';
        if (userHeader) userHeader.style.display = 'none';
      }
    }

    function registerUserLocally(email, name) {
        let users = JSON.parse(localStorage.getItem('noel_users_list') || "{}");
        users[email] = name;
        localStorage.setItem('noel_users_list', JSON.stringify(users));
    }

    /* --- GESTION ADMIN --- */
    function showAdminPanel() {
        const select = document.getElementById('admin-user-select');
        select.innerHTML = '<option value="">-- Choisir un destinataire --</option>';
        let users = JSON.parse(localStorage.getItem('noel_users_list') || "{}");
        for (let email in users) {
            let opt = document.createElement('option');
            opt.value = email;
            opt.innerText = `${users[email]} (${email})`;
            select.appendChild(opt);
        }
        document.getElementById('admin-letter-text').value = "";
        document.getElementById('admin-view-reply').innerText = "";
        document.getElementById('admin-single-edit').style.display = 'block';
        document.getElementById('admin-all-letters-list').style.display = 'none';
        switchView('view-admin-panel');
    }

    function loadSelectedUserLetter() {
        const email = document.getElementById('admin-user-select').value;
        if (!email) return;
        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        let replies = JSON.parse(localStorage.getItem('noel_replies') || "{}");
        
        document.getElementById('admin-letter-text').value = letters[email] || "";
        
        const replyText = replies[email];
        document.getElementById('admin-view-reply').innerText = replyText ? "📩 Réponse reçue : " + replyText : "Aucune réponse reçue pour le moment.";
    }

    function saveLetterForUser() {
        const email = document.getElementById('admin-user-select').value;
        const text = document.getElementById('admin-letter-text').value;
        if (!email) return alert("Choisis un utilisateur !");

        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        letters[email] = text;
        localStorage.setItem('noel_letters', JSON.stringify(letters));
        alert("Lettre enregistrée ✨");
    }

    function toggleAllLettersView() {
        const listDiv = document.getElementById('admin-all-letters-list');
        const singleDiv = document.getElementById('admin-single-edit');
        if (listDiv.style.display === 'none') {
            listDiv.style.display = 'block';
            singleDiv.style.display = 'none';
            renderAllLetters();
        } else {
            listDiv.style.display = 'none';
            singleDiv.style.display = 'block';
        }
    }

    function renderAllLetters() {
        const container = document.getElementById('all-letters-container');
        container.innerHTML = "";
        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        let users = JSON.parse(localStorage.getItem('noel_users_list') || "{}");
        let replies = JSON.parse(localStorage.getItem('noel_replies') || "{}");

        for (let email in users) {
            let card = document.createElement('div');
            card.className = "all-letters-card";
            card.innerHTML = `
                <strong style="color:#800c19;">${users[email]} (${email})</strong><br>
                <textarea class="admin-textarea" id="edit-let-${email.replace(/[^a-zA-Z0-9]/g, '')}" style="width:100%; height:60px; margin:5px 0;">${letters[email] || ""}</textarea>
                <button class="btn-question btn-green" style="padding:4px; font-size:0.75rem;" onclick="saveDirectLetter('${email}')">Sauvegarder</button>
                <div style="font-size:0.75rem; color:#555; margin-top:4px;"><b>Réponse :</b> ${replies[email] || 'Aucune'}</div>
            `;
            container.appendChild(card);
        }
    }

    function saveDirectLetter(email) {
        const fieldId = "edit-let-" + email.replace(/[^a-zA-Z0-9]/g, '');
        const val = document.getElementById(fieldId).value;
        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        letters[email] = val;
        localStorage.setItem('noel_letters', JSON.stringify(letters));
        alert("Lettre modifiée pour " + email);
    }

    /* --- VUE JOUEUR & RÉPONSE --- */
    function showUserLetter() {
        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        let replies = JSON.parse(localStorage.getItem('noel_replies') || "{}");

        const myLetter = letters[currentUserEmail];
        const displayBox = document.getElementById('user-letter-content');

        if (myLetter && myLetter.trim() !== "") {
            displayBox.innerText = myLetter;
        } else {
            displayBox.innerText = "Hop hop hop !\nTa lettre de Noël est en préparation par le Père Noël...\n\nReviens très bientôt ! 🎄";
        }

        document.getElementById('user-reply-input').value = replies[currentUserEmail] || "";
        switchView('view-user-letter');
        
        // Lancer confettis (Mega le 25 Décembre)
        checkChristmasConfetti();
    }

    function sendReplyToAdmin() {
        const replyText = document.getElementById('user-reply-input').value;
        if(!replyText.trim()) return alert("Écris un message avant d'envoyer !");

        let replies = JSON.parse(localStorage.getItem('noel_replies') || "{}");
        replies[currentUserEmail] = replyText;
        localStorage.setItem('noel_replies', JSON.stringify(replies));
        alert("Ta réponse a bien été envoyée au Père Noël ! 🎅✨");
    }

    /* --- MEGA CONFETTIS DE NOËL --- */
    function checkChristmasConfetti() {
        const today = new Date();
        const isChristmas = (today.getMonth() === 11 && today.getDate() === 25);

        if (isChristmas) {
            // MÉGA CONFETTIS ENORMES POUR LE 25 DÉCEMBRE
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 100,
                    startVelocity: 60,
                    scalar: 3.5, // Taille géante des confettis !
                    origin: { y: 0.85 },
                    colors: ['#d4a017', '#b30000', '#2d5a27', '#ffffff']
                });
            }
        } else {
            // CONFETTIS CLASSIQUES
            launchConfetti();
        }
    }

    function launchConfetti(event) {
        if(event && (event.target.tagName === 'BUTTON' || event.target.tagName === 'TEXTAREA')) return;
        if (typeof confetti === 'function') {
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.9 },
                colors: ['#d4a017', '#b30000', '#2d5a27', '#ffffff']
            });
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      handleSession(session);
      supabaseClient.auth.onAuthStateChange((_event, session) => { handleSession(session); });
    });

    const allData = [];
    let currentLevel = 0, currentAvantage = 1, activeIndex = -1, isAiMode = false, currentAiQ = ["", ""];

    const levels = [
        { name: "DÉFIS FACILES", class: "theme-vert", btnClass: "btn-green", start: 0 },
        { name: "DÉFIS MOYENS", class: "theme-or", btnClass: "btn-gold", start: 100 },
        { name: "DÉFIS DIFFICILES", class: "theme-rouge", btnClass: "btn-red", start: 200 }
    ];

    function normalize(str) {
        if(!str) return "";
        return str.toString().toLowerCase()
            .replace(/[éèêë]/g, 'e').replace(/[àâ]/g, 'a').replace(/[îï]/g, 'i').replace(/[ôö]/g, 'o').replace(/[ûù]/g, 'u')
            .replace(/^(le |la |les |l\'|un |une |des )/, "").replace(/\s/g, "").trim();
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
        document.getElementById(viewId).classList.add('active-view');
        
        const nav = document.getElementById('nav-arrows');
        const bg = document.getElementById('main-scroll-bg');

        if (viewId === 'view-questions-list') {
            nav.style.display = 'block'; bg.style.opacity = "1";
            document.getElementById('btn-arrow-L').onclick = () => changeLevel(-1);
            document.getElementById('btn-arrow-R').onclick = () => changeLevel(1);
        } else if (viewId === 'view-submenu-avantages') {
            nav.style.display = 'block'; bg.style.opacity = "0";
            document.getElementById('btn-arrow-L').onclick = () => moveAvantage(-1);
            document.getElementById('btn-arrow-R').onclick = () => moveAvantage(1);
            document.getElementById('avantage-title').innerText = "AVANTAGE " + currentAvantage;
        } else {
            nav.style.display = 'none'; bg.style.opacity = "1";
        }
        document.querySelector('.scroll-box').scrollTop = 0;
    }

    function moveAvantage(dir) {
        currentAvantage = (currentAvantage + dir - 1 + 20) % 20 + 1;
        document.getElementById('avantage-title').innerText = "AVANTAGE " + currentAvantage;
    }

    function showSubMenu(type) {
        document.body.className = "theme-menu";
        if(type === 'questions') switchView('view-submenu-questions');
        if(type === 'avantages') switchView('view-submenu-avantages');
    }

    function backToMain() { document.body.className = "theme-menu"; switchView('view-main-menu'); }

    function goToLevel(idx) { currentLevel = idx; renderQuestionsList(); switchView('view-questions-list'); }

    function renderQuestionsList() {
        const listInner = document.getElementById('questions-container-inner');
        const level = levels[currentLevel];
        document.getElementById('level-title').innerText = "📜 " + level.name;
        document.body.className = level.class;
        listInner.innerHTML = "";
        
        const solved = JSON.parse(localStorage.getItem('noel_solved') || "[]");

        for (let i = 1; i <= 100; i++) {
            const qID = level.start + i - 1;
            const isDone = solved.includes(qID);
            let btn = document.createElement('button');
            btn.className = `btn-question ${level.btnClass} ${isDone ? 'completed' : ''}`;
            btn.innerText = isDone ? `DÉFI RÉUSSI` : `QUESTION ${i}`;
            btn.onclick = () => showQuestion(qID, false);
            listInner.appendChild(btn);
        }
    }

    function showQuestion(id, isAi) {
        isAiMode = isAi;
        document.getElementById('hint-text').style.visibility = "hidden";
        activeIndex = id;
        document.getElementById('current-q-text').innerText = allData[id] ? allData[id][0] : "Question vide";
        document.getElementById('user-ans-input').value = "";
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('question-view').style.display = 'flex';
        document.getElementById('user-ans-input').focus();
    }

    function hideQuestion() {
        document.getElementById('question-view').style.display = 'none';
        document.getElementById('list-view').style.display = 'block';
        renderQuestionsList();
    }

    function checkAnswer() {
        const userAns = normalize(document.getElementById('user-ans-input').value);
        const correctAns = normalize(allData[activeIndex] ? allData[activeIndex][1] : "");
        if (userAns !== "" && userAns === correctAns) {
            alert("Bravo ! ✨");
            let solved = JSON.parse(localStorage.getItem('noel_solved') || "[]");
            if (!solved.includes(activeIndex)) solved.push(activeIndex);
            localStorage.setItem('noel_solved', JSON.stringify(solved));
            hideQuestion();
        } else {
            alert("Oh non ! ❄️");
        }
    }

    function devUnlock() {
        if(confirm("Réinitialiser la progression ?")) {
            localStorage.removeItem('noel_solved');
            alert("Progression réinitialisée !");
        }
    }

    function changeLevel(dir) {
        currentLevel = (currentLevel + dir + 3) % 3;
        renderQuestionsList();
    }

    document.getElementById('user-ans-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
</script>
</body>
</html>
