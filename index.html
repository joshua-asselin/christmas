<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue 🎄</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .btn-google {
      background-color: white;
      color: #333;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      transition: background-color 0.2s;
    }

    .btn-google:hover {
      background-color: #f1f5f9;
    }

    .profile-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      object-fit: cover;
    }

    .avatar-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #0284c7;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 600;
    }

    .btn-logout:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <div id="login-card" class="card">
    <h1>Bienvenue 🎄</h1>
    <p>Connecte-toi avec Google pour continuer.</p>
    <button onclick="loginWithGoogle()" class="btn-google">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google">
      Continuer avec Google
    </button>
  </div>

  <div id="user-profile" class="card" style="display: none;"></div>

  <script>
    // Configuration de ton projet Supabase
    const SUPABASE_URL = 'https://frwxwmynjgzbjwwjxscp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyd3h3bXluamd6Ymp3d2p4c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDQ4OTUsImV4cCI6MjEwMDcyMDg5NX0.2Ps0PvrEu0xqyfN1UjAZ2qcPBEZ-ilMYjApi91omQCA';

    // Initialisation sécurisée du client Supabase
    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    // Fonction de connexion Google
    async function loginWithGoogle() {
      if (!supabaseClient) {
        alert("Erreur: Le SDK Supabase n'est pas chargé correctement.");
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: 'https://christmasss2026.vercel.app'
        }
      });

      if (error) {
        alert('Erreur de connexion : ' + error.message);
      }
    }

    // Gestion automatique de la session utilisateur
    window.addEventListener('DOMContentLoaded', async () => {
      if (!supabaseClient) return;

      // 1. Vérifie si l'utilisateur est déjà connecté
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showUserProfile(session.user);
      }

      // 2. Écoute la réponse au retour de Google OAuth
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          showUserProfile(session.user);
        }
      });
    });

    // Fonction d'affichage du profil connecté
    function showUserProfile(user) {
      document.getElementById('login-card').style.display = 'none';
      const profileContainer = document.getElementById('user-profile');
      profileContainer.style.display = 'block';

      const metadata = user.user_metadata || {};
      const name = metadata.full_name || metadata.name || user.email || 'Joueur';
      const avatarUrl = metadata.avatar_url || metadata.picture;

      const avatarHTML = avatarUrl 
        ? `<img src="${avatarUrl}" class="avatar-img" alt="Avatar">`
        : `<div class="avatar-circle">${name.charAt(0).toUpperCase()}</div>`;

      profileContainer.innerHTML = `
        <div class="profile-box">
          ${avatarHTML}
          <h3>Connecté en tant que :</h3>
          <div style="font-size: 1.2rem; font-weight: bold;">${name}</div>
          <button onclick="logout()" class="btn-logout">Déconnexion</button>
        </div>
      `;
    }

    // Fonction de déconnexion
    async function logout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        window.location.reload();
      }
    }
  </script>
</body>
</html>
