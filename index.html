<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les 300 Défis de Noël</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #f3cf7a;
            --gold-glow: rgba(243, 207, 122, 0.4);
            --red-accent: #e63946;
            --green-accent: #2a9d8f;
            --bg-dark: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e0912 0%, #0a0306 100%), 
                        url('https://images.unsplash.com/photo-1512389142860-9c449e58a543?q=80&w=2069&auto=format&fit=crop') center/cover no-repeat;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }

        /* --- OVERLAY VERRE GIVRÉ (LOGIN) --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 2, 5, 0.82);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            z-index: 1000; display: flex; justify-content: center; align-items: center;
            animation: fadeIn 0.6s ease-out;
        }

        .glass-card {
            background: rgba(30, 10, 18, 0.65);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(243, 207, 122, 0.15);
            padding: 3rem 2.5rem; text-align: center; max-width: 420px; width: 90%;
            position: relative; overflow: hidden;
        }

        .glass-card::before {
            content: ''; position: absolute; top: 0; left: -50%; width: 200%; height: 100%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(30deg); pointer-events: none;
        }

        .glass-card h1 {
            font-family: 'Cinzel Decorative', serif; font-size: 1.8rem;
            color: var(--gold); margin: 0 0 10px 0;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .glass-card p {
            color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; font-weight: 400;
        }

        .btn-google {
            background: #ffffff; color: #0f172a; border: none;
            padding: 14px 24px; font-size: 0.95rem; font-weight: 600;
            border-radius: 50px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-google:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255,255,255,0.2);
        }

        /* --- PROFIL HEADER --- */
        #user-header {
            position: fixed; top: 20px; right: 25px; display: none;
            align-items: center; gap: 12px; background: rgba(15, 5, 10, 0.75);
            backdrop-filter: blur(12px); padding: 8px 18px; border-radius: 50px;
            border: 1px solid var(--glass-border); z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .avatar-img, .avatar-circle {
            width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--gold);
        }

        .avatar-circle {
            background: linear-gradient(135deg, #e63946, #800f2f);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem;
        }

        .btn-admin-badge {
            background: linear-gradient(135deg, var(--gold), #d4a017); color: #000;
            border: none; padding: 6px 14px; border-radius: 20px;
            font-weight: 700; font-size: 0.75rem; cursor: pointer; display: none;
            box-shadow: 0 0 12px var(--gold-glow); transition: transform 0.2s;
        }
        .btn-admin-badge:hover { transform: scale(1.05); }

        .btn-header-logout {
            background: rgba(255,255,255,0.1); color: #f1f5f9; border: 1px solid var(--glass-border);
            padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s;
        }
        .btn-header-logout:hover { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }

        /* --- FENÊTRE PRINCIPALE DU JEU --- */
        .container {
            width: 90vw; max-width: 900px; height: 82vh;
            background: rgba(20, 8, 14, 0.7);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 32px; border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 50px rgba(243, 207, 122, 0.1);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        .scroll-box {
            width: 100%; height: 100%; overflow-y: auto; padding: 2.5rem 2rem;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        /* --- NAV ARROWS --- */
        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
            color: #fff; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 10; transition: all 0.3s;
            backdrop-filter: blur(8px);
        }
        .nav-arrow:hover { background: var(--gold); color: #000; transform: translateY(-50%) scale(1.1); }
        .arrow-left { left: 15px; } .arrow-right { right: 15px; }

        /* --- TITRES ET MENUS --- */
        h1 {
            font-family: 'Cinzel Decorative', serif; font-size: 2rem; text-align: center;
            color: var(--gold); margin-bottom: 2rem; text-shadow: 0 0 20px var(--gold-glow);
        }

        .btn-modern {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; max-width: 420px; margin: 10px auto; padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 16px;
            color: #f8fafc; font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .btn-modern:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--gold); transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 15px var(--gold-glow);
        }

        .btn-green:hover { border-color: var(--green-accent); box-shadow: 0 0 20px rgba(42, 157, 143, 0.4); }
        .btn-gold:hover { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); }
        .btn-red:hover { border-color: var(--red-accent); box-shadow: 0 0 20px rgba(230, 57, 70, 0.4); }

        .btn-modern.completed {
            opacity: 0.4; border-color: transparent; cursor: default;
            background: rgba(255,255,255,0.02); transform: none !important; box-shadow: none !important;
        }

        /* --- VUES --- */
        .view-section { display: none; flex-direction: column; align-items: center; opacity: 0; }
        .active-view { display: flex; opacity: 1; animation: slideUp 0.4s ease-out forwards; }

        /* --- VUE QUESTION --- */
        #question-view {
            display: none; position: absolute; inset: 0;
            background: rgba(10, 3, 7, 0.92); backdrop-filter: blur(20px);
            z-index: 20; justify-content: center; align-items: center; flex-direction: column;
            padding: 2rem; text-align: center;
        }

        .question-card { max-width: 550px; width: 100%; }
        .question-card h2 { font-size: 1.3rem; font-weight: 500; line-height: 1.6; color: #f1f5f9; margin-bottom: 1.5rem; }

        .input-modern, .textarea-modern, .select-modern {
            width: 100%; padding: 14px 18px; border-radius: 14px;
            background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border);
            color: #fff; font-size: 1rem; font-family: inherit; margin-bottom: 1rem;
            outline: none; transition: all 0.3s; text-align: center;
        }
        .textarea-modern { text-align: left; height: 120px; resize: none; }
        .input-modern:focus, .textarea-modern:focus, .select-modern:focus {
            border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); background: rgba(255,255,255,0.1);
        }

        .grid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 10px; }
        .btn-action {
            padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-size: 0.9rem;
        }
        .btn-check { background: var(--gold); color: #000; }
        .btn-check:hover { transform: translateY(-2px); box-shadow: 0 0 15px var(--gold-glow); }
        .btn-back { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .letter-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; max-width: 600px; width: 100%;
            margin: 15px 0; font-size: 1rem; line-height: 1.7; color: #e2e8f0; text-align: left;
        }

        /* ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="glass-card">
        <h1>Lettre de Noël</h1>
        <p>Connecte-toi avec Google pour recevoir ta lettre personnalisée de l'administrateur et relever les 300 défis !</p>
        <button onclick="loginWithGoogle()" class="btn-google">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google">
            Continuer avec Google
        </button>
    </div>
</div>

<div id="user-header">
    <div id="user-avatar-slot"></div>
    <span id="user-name-slot" style="font-weight: 600; font-size: 0.85rem;"></span>
    <button id="btn-admin-header" class="btn-admin-badge" onclick="showAdminPanel()">⚙️ ADMIN</button>
    <button onclick="logout()" class="btn-header-logout">Déconnexion</button>
</div>

<div class="container">
    <div id="nav-arrows" style="display: none;">
        <div class="nav-arrow arrow-left" id="btn-arrow-L">❮</div>
        <div class="nav-arrow arrow-right" id="btn-arrow-R">❯</div>
    </div>

    <div class="scroll-box">
        
        <div id="view-main-menu" class="view-section active-view">
            <h1>MENU PRINCIPAL</h1>
            <button class="btn-modern" onclick="showSubMenu('questions')">🎁 QUESTIONS</button>
            <button class="btn-modern" onclick="showSubMenu('avantages')">✨ AVANTAGES</button>
            <button class="btn-modern btn-gold" onclick="showUserLetter()">✉️ MA LETTRE DE NOËL</button>
            <button id="btn-admin-menu" class="btn-modern btn-gold" style="display:none;" onclick="showAdminPanel()">⚙️ PANNEAU ADMIN</button>
        </div>

        <div id="view-submenu-questions" class="view-section">
            <h1>SÉLECTION DU NIVEAU</h1>
            <button class="btn-modern btn-green" onclick="goToLevel(0)">🟢 DÉFIS FACILES</button>
            <button class="btn-modern btn-gold" onclick="goToLevel(1)">🟡 DÉFIS MOYENS</button>
            <button class="btn-modern btn-red" onclick="goToLevel(2)">🔴 DÉFIS DIFFICILES</button>
            <button class="btn-modern" onclick="devUnlock()">🔓 DEV UNLOCK</button>
            <button class="btn-modern" style="margin-top:15px;" onclick="backToMain()">RETOUR</button>
        </div>

        <div id="view-submenu-avantages" class="view-section">
            <h1 id="avantage-title">AVANTAGE 1</h1>
            <img id="avantage-scroll-img" src="https://i.postimg.cc/mrYm0SXf/Capture-d-e-cran-le-2026-02-09-a-17-25-24-removebg-preview.png" style="width: 100%; max-width: 450px; border-radius: 16px; margin: 10px 0;">
            <button class="btn-modern" onclick="backToMain()">RETOUR</button>
        </div>

        <div id="view-questions-list" class="view-section">
            <h1 id="level-title">📜 LISTE DES DÉFIS</h1>
            <div id="questions-container-inner" style="width: 100%;"></div>
            <button class="btn-modern" style="margin-top:15px;" onclick="backToMain()">🏠 MENU PRINCIPAL</button>
        </div>

        <div id="view-user-letter" class="view-section">
            <h1>✉️ TA LETTRE DE NOËL</h1>
            <div id="user-letter-content" class="letter-box">Chargement...</div>
            <button class="btn-modern" onclick="backToMain()">RETOUR</button>
        </div>

        <div id="view-admin-panel" class="view-section">
            <h1>⚙️ PANNEAU ADMIN</h1>
            <select id="admin-user-select" class="select-modern" onchange="loadSelectedUserLetter()">
                <option value="">-- Sélectionner un destinataire --</option>
            </select>
            <textarea id="admin-letter-text" class="textarea-modern" placeholder="Écris la lettre de Noël ici..."></textarea>
            <button class="btn-modern btn-green" onclick="saveLetterForUser()">💾 ENREGISTRER & ENVOYER</button>
            <button class="btn-modern" onclick="backToMain()">RETOUR</button>
        </div>

    </div>

    <div id="question-view">
        <div class="question-card">
            <h2 id="current-q-text">...</h2>
            <div id="hint-text" style="color:var(--gold); margin-bottom:10px; visibility:hidden;"></div>
            <input type="text" id="user-ans-input" class="input-modern" placeholder="Écris ta réponse..." autocomplete="off">
            <div class="grid-actions">
                <button class="btn-action btn-check" onclick="checkAnswer()">Valider</button>
                <button class="btn-action btn-back" onclick="hideQuestion()">Retour</button>
            </div>
        </div>
    </div>
</div>

<script>
    const ADMIN_EMAILS = ["asselinj24@emm.qc.ca", "josh.asselin15@gmail.com"];
    let currentUserEmail = "";

    const SUPABASE_URL = 'https://frwxwmynjgzbjwwjxscp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyd3h3bXluamd6Ymp3d2p4c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDQ4OTUsImV4cCI6MjEwMDcyMDg5NX0.2Ps0PvrEu0xqyfN1UjAZ2qcPBEZ-ilMYjApi91omQCA';

    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    async function loginWithGoogle() {
      if (!supabaseClient) return alert("Erreur Supabase");
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://christmasss2026.vercel.app' }
      });
    }

    async function logout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        window.location.reload();
      }
    }

    function handleSession(session) {
      const overlay = document.getElementById('login-overlay');
      const userHeader = document.getElementById('user-header');

      if (session) {
        if (overlay) overlay.style.display = 'none';
        if (userHeader) userHeader.style.display = 'flex';

        const user = session.user;
        currentUserEmail = user.email || "";
        const metadata = user.user_metadata || {};
        const name = metadata.full_name || metadata.name || currentUserEmail || 'Joueur';
        const avatarUrl = metadata.avatar_url || metadata.picture;

        document.getElementById('user-name-slot').innerText = name;
        const avatarSlot = document.getElementById('user-avatar-slot');

        if (avatarUrl) {
          avatarSlot.innerHTML = `<img src="${avatarUrl}" class="avatar-img" alt="Avatar">`;
        } else {
          avatarSlot.innerHTML = `<div class="avatar-circle">${name.charAt(0).toUpperCase()}</div>`;
        }

        const isAdmin = ADMIN_EMAILS.includes(currentUserEmail.toLowerCase());
        document.getElementById('btn-admin-header').style.display = isAdmin ? 'inline-block' : 'none';
        document.getElementById('btn-admin-menu').style.display = isAdmin ? 'flex' : 'none';

        registerUserLocally(currentUserEmail, name);
      } else {
        if (overlay) overlay.style.display = 'flex';
        if (userHeader) userHeader.style.display = 'none';
      }
    }

    function registerUserLocally(email, name) {
        let users = JSON.parse(localStorage.getItem('noel_users_list') || "{}");
        users[email] = name;
        localStorage.setItem('noel_users_list', JSON.stringify(users));
    }

    function showAdminPanel() {
        const select = document.getElementById('admin-user-select');
        select.innerHTML = '<option value="">-- Sélectionner un destinataire --</option>';
        let users = JSON.parse(localStorage.getItem('noel_users_list') || "{}");
        for (let email in users) {
            let opt = document.createElement('option');
            opt.value = email;
            opt.innerText = `${users[email]} (${email})`;
            select.appendChild(opt);
        }
        document.getElementById('admin-letter-text').value = "";
        switchView('view-admin-panel');
    }

    function loadSelectedUserLetter() {
        const email = document.getElementById('admin-user-select').value;
        if (!email) return;
        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        document.getElementById('admin-letter-text').value = letters[email] || "";
    }

    function saveLetterForUser() {
        const email = document.getElementById('admin-user-select').value;
        const text = document.getElementById('admin-letter-text').value;
        if (!email) return alert("Choisis un utilisateur !");

        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        letters[email] = text;
        localStorage.setItem('noel_letters', JSON.stringify(letters));
        alert("Lettre enregistrée pour " + email + " ✨");
    }

    function showUserLetter() {
        let letters = JSON.parse(localStorage.getItem('noel_letters') || "{}");
        const myLetter = letters[currentUserEmail];
        const displayBox = document.getElementById('user-letter-content');

        if (myLetter && myLetter.trim() !== "") {
            displayBox.innerText = myLetter;
        } else {
            displayBox.innerText = "🎅 Ta lettre de Noël est en préparation par le Père Noël. Reviens bientôt ! ✨";
        }
        switchView('view-user-letter');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      handleSession(session);
      supabaseClient.auth.onAuthStateChange((_event, session) => { handleSession(session); });
    });

    const allData = [];
    let currentLevel = 0, currentAvantage = 1, activeIndex = -1;

    const levels = [
        { name: "DÉFIS FACILES", btnClass: "btn-green", start: 0 },
        { name: "DÉFIS MOYENS", btnClass: "btn-gold", start: 100 },
        { name: "DÉFIS DIFFICILES", btnClass: "btn-red", start: 200 }
    ];

    function normalize(str) {
        if(!str) return "";
        return str.toString().toLowerCase()
            .replace(/[éèêë]/g, 'e').replace(/[àâ]/g, 'a').replace(/[îï]/g, 'i').replace(/[ôö]/g, 'o').replace(/[ûù]/g, 'u')
            .replace(/^(le |la |les |l\'|un |une |des )/, "").replace(/\s/g, "").trim();
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
        document.getElementById(viewId).classList.add('active-view');
        const nav = document.getElementById('nav-arrows');
        nav.style.display = (viewId === 'view-questions-list' || viewId === 'view-submenu-avantages') ? 'flex' : 'none';
        
        if (viewId === 'view-questions-list') {
            document.getElementById('btn-arrow-L').onclick = () => changeLevel(-1);
            document.getElementById('btn-arrow-R').onclick = () => changeLevel(1);
        } else if (viewId === 'view-submenu-avantages') {
            document.getElementById('btn-arrow-L').onclick = () => moveAvantage(-1);
            document.getElementById('btn-arrow-R').onclick = () => moveAvantage(1);
        }
        document.querySelector('.scroll-box').scrollTop = 0;
    }

    function moveAvantage(dir) {
        currentAvantage = (currentAvantage + dir - 1 + 20) % 20 + 1;
        document.getElementById('avantage-title').innerText = "AVANTAGE " + currentAvantage;
    }

    function showSubMenu(type) {
        if(type === 'questions') switchView('view-submenu-questions');
        if(type === 'avantages') switchView('view-submenu-avantages');
    }

    function backToMain() { switchView('view-main-menu'); }

    function goToLevel(idx) {
        currentLevel = idx;
        renderQuestionsList();
        switchView('view-questions-list');
    }

    function renderQuestionsList() {
        const listInner = document.getElementById('questions-container-inner');
        const level = levels[currentLevel];
        document.getElementById('level-title').innerText = "📜 " + level.name;
        listInner.innerHTML = "";
        
        const solved = JSON.parse(localStorage.getItem('noel_solved') || "[]");

        for (let i = 1; i <= 100; i++) {
            const qID = level.start + i - 1;
            const isDone = solved.includes(qID);
            let btn = document.createElement('button');
            btn.className = `btn-modern ${level.btnClass} ${isDone ? 'completed' : ''}`;
            btn.innerText = isDone ? `DÉFI RÉUSSI ✨` : `QUESTION ${i}`;
            btn.onclick = () => showQuestion(qID);
            listInner.appendChild(btn);
        }
    }

    function showQuestion(id) {
        activeIndex = id;
        document.getElementById('current-q-text').innerText = allData[id] ? allData[id][0] : "Question vide";
        document.getElementById('user-ans-input').value = "";
        document.getElementById('question-view').style.display = 'flex';
        document.getElementById('user-ans-input').focus();
    }

    function hideQuestion() { document.getElementById('question-view').style.display = 'none'; renderQuestionsList(); }

    function checkAnswer() {
        const userAns = normalize(document.getElementById('user-ans-input').value);
        const correctAns = normalize(allData[activeIndex] ? allData[activeIndex][1] : "");
        if (userAns !== "" && userAns === correctAns) {
            alert("Bravo ! ✨");
            let solved = JSON.parse(localStorage.getItem('noel_solved') || "[]");
            if (!solved.includes(activeIndex)) solved.push(activeIndex);
            localStorage.setItem('noel_solved', JSON.stringify(solved));
            hideQuestion();
        } else {
            alert("Oh non ! ❄️ Essayez encore !");
        }
    }

    function devUnlock() {
        if(confirm("Réinitialiser la progression ?")) {
            localStorage.removeItem('noel_solved');
            alert("Progression réinitialisée !");
        }
    }

    function changeLevel(dir) {
        currentLevel = (currentLevel + dir + 3) % 3;
        renderQuestionsList();
    }

    document.getElementById('user-ans-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
</script>
</body>
</html>
