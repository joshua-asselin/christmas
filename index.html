<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Google avec Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn-google {
      background-color: #ffffff;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-google:hover {
      background-color: #e2e8f0;
    }
    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 12px;
      border: 2px solid #38bdf8;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="login-section">
      <h1>Bienvenue 🎄</h1>
      <p>Connecte-toi avec Google pour continuer.</p>
      <button class="btn-google" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continuer avec Google
      </button>
    </div>

    <div id="user-section" class="hidden">
      <img id="user-avatar" class="avatar" src="" alt="Avatar">
      <h2 id="user-name" style="margin: 0; font-size: 20px;"></h2>
      <p id="user-email" style="margin-top: 4px;"></p>
      <button class="btn-logout" onclick="logout()">Se déconnecter</button>
    </div>
  </div>

  <script>
    // Configuration Supabase avec tes vraies données
    const SUPABASE_URL = 'https://frwxwmynjgzbjwwjxscp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_H3aGonNQ-FxziZENkqPYBA_aICuZ4eD';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fonction pour lancer la connexion Google
    async function loginWithGoogle() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) alert('Erreur : ' + error.message);
    }

    // Fonction de déconnexion
    async function logout() {
      await supabase.auth.signOut();
      window.location.reload();
    }

    // Vérification automatique au chargement
    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();

      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('user-section').classList.remove('hidden');

        document.getElementById('user-name').innerText = user.user_metadata.full_name || 'Utilisateur';
        document.getElementById('user-email').innerText = user.email;
        document.getElementById('user-avatar').src = user.user_metadata.avatar_url;
      }
    }

    checkUser();
  </script>

</body>
</html>
