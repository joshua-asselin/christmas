<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Poppins:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            /* Image d'arrière-plan globale */
            background-image: linear-gradient(rgba(11, 19, 31, 0.75), rgba(11, 19, 31, 0.75)), 
                              url('https://i.postimg.cc/rFB7TZN4/pngtree-christmas-background-vector-illustration-space-for-writing-text-picture-image-16035994-(1).png');
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Poppins', sans-serif; padding-bottom: 25px;
        }

        /* Bannière supérieure en plein écran/large */
        .header-banner {
            margin-top: 15px;
            width: 95%; max-width: 1400px; height: 140px;
            background-image: url('https://i.postimg.cc/Kc7F8rdr/53a6d70e-6093-4bdd-a3d0-3b43e8c70781-885x590.jpg');
            background-size: cover; background-position: center;
            border-radius: 20px; border: 3px solid #d4a017;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            cursor: pointer;
        }

        .header-title {
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            padding: 10px 30px; border-radius: 40px;
            border: 1.5px solid #ffd700; color: #ffffff;
            font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 800;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); text-align: center;
            transition: all 0.3s ease;
        }

        /* Animation Clignotement (Flash) 4 fois */
        @keyframes flashAnim {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.03); color: #ffd700; }
        }

        .header-title.flashing {
            animation: flashAnim 0.5s ease-in-out 4;
        }

        /* Conteneur principal semi-transparent blanc */
        .calendar-container {
            margin-top: 15px; width: 95%; max-width: 1400px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 24px; border: 2.5px solid #d4a017;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); padding: 18px;
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .calendar-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .calendar-container { grid-template-columns: repeat(3, 1fr); padding: 12px; gap: 8px; }
            .header-banner { height: 110px; }
            .header-title { font-size: 1.2rem; padding: 6px 16px; }
        }
        @media (max-width: 480px) {
            .calendar-container { grid-template-columns: repeat(2, 1fr); }
        }

        /* Case / Porte du calendrier */
        .door-frame {
            position: relative; height: 100px; perspective: 1000px;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
        }

        /* Contenu sous la porte */
        .door-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #fffdf5, #f5e6ca);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 6px;
            border-radius: 12px; border: 1.5px solid #d4a017;
            overflow: hidden;
        }

        /* Grand numéro en arrière-plan */
        .door-bg-number {
            position: absolute;
            font-family: 'Cinzel', serif;
            font-size: 3.8rem;
            font-weight: 800;
            color: rgba(212, 160, 23, 0.18);
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }

        .door-content .reward-emoji { font-size: 1.6rem; margin-bottom: 2px; z-index: 1; }
        .door-content .reward-text { font-size: 0.72rem; font-weight: 600; color: #4a2d0b; line-height: 1.1; z-index: 1; }

        /* Porte extérieure */
        .door-front {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #800c19, #b30000);
            border: 2px solid #ffd700; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 800;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.5); cursor: pointer;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
            z-index: 2;
        }

        .door-front::after {
            content: "✨"; position: absolute; bottom: 4px; right: 6px; font-size: 0.7rem; opacity: 0.6;
        }

        /* Ouverture 3D */
        .door-frame.open .door-front {
            transform: rotateY(-160deg) scaleX(0.85);
            box-shadow: 10px 0 20px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        .door-frame.locked .door-front {
            background: linear-gradient(135deg, #4a4a4a, #2c2c2c);
            border-color: #888; cursor: not-allowed; opacity: 0.85;
        }

        /* Bouton Retour */
        .btn-back {
            margin-top: 18px; padding: 10px 30px; border-radius: 30px;
            background: linear-gradient(135deg, #d4a017, #aa7c11);
            color: #200407; border: 2px solid #fff; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.3s ease;
        }
        .btn-back:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- Bannière image avec interaction au survol -->
    <div class="header-banner" id="banner">
        <div class="header-title" id="header-title">📅 CALENDRIER DE L'AVENT</div>
    </div>

    <!-- Conteneur des 25 portes -->
    <div class="calendar-container" id="calendar-grid"></div>

    <button class="btn-back" onclick="window.location.href='index.html'">⬅️ RETOUR AU MENU</button>

<script>
    let isBypassed = false;

    // 25 Récompenses / Surprises
    const rewards = [
        { emoji: "🍫", text: "Chocolat chaud gourmand !" },
        { emoji: "🎬", text: "Soirée film de Noël" },
        { emoji: "🎨", text: "Dessine un bonhomme de neige" },
        { emoji: "🍪", text: "Cuisine des biscuits" },
        { emoji: "🎁", text: "Avantage mystère débloqué !" },
        { emoji: "🎶", text: "Écoute tes chants préférés" },
        { emoji: "🎄", text: "Décore ton sapin" },
        { emoji: "💌", text: "Envoie un mot doux" },
        { emoji: "⭐", text: "Fais un vœu sous les étoiles" },
        { emoji: "🧩", text: "Résous le casse-tête" },
        { emoji: "🍵", text: "Thé de Noël aux épices" },
        { emoji: "❄️", text: "Bataille de boules de neige" },
        { emoji: "📜", text: "Lis un conte de Noël" },
        { emoji: "🕯️", text: "Allume une bougie parfumée" },
        { emoji: "🎅", text: "Message secret du Père Noël" },
        { emoji: "📷", text: "Prends une photo festive" },
        { emoji: "🎁", text: "Un bonus exclusif !" },
        { emoji: "🍬", text: "Déguste une sucrerie" },
        { emoji: "🧸", text: "Fais une bonne action" },
        { emoji: "🔔", text: "Fais tinter les cloches !" },
        { emoji: "⛄", text: "Construis un bonhomme de neige" },
        { emoji: "✨", text: "Soirée pyjama de Noël" },
        { emoji: "🛷", text: "Nuit magique en approche" },
        { emoji: "👑", text: "Joyeux Réveillon de Noël !" },
        { emoji: "🎅", text: "Joyeux Noël ! Grande surprise finale !" }
    ];

    function createCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const today = new Date();
        const currentMonth = today.getMonth(); // 11 = Décembre
        const currentDay = today.getDate();

        const openedDoors = JSON.parse(localStorage.getItem('opened_advent_doors') || "[]");

        for (let i = 1; i <= 25; i++) {
            const frame = document.createElement('div');
            frame.className = 'door-frame';

            // Condition de déverrouillage
            const isAvailable = isBypassed || (currentMonth === 11 && i <= currentDay) || currentMonth > 11;

            if (!isAvailable) {
                frame.classList.add('locked');
            }

            const reward = rewards[i - 1];

            frame.innerHTML = `
                <div class="door-content">
                    <div class="door-bg-number">${i}</div>
                    <div class="reward-emoji">${reward.emoji}</div>
                    <div class="reward-text">${reward.text}</div>
                </div>
                <div class="door-front">${i}</div>
            `;

            const front = frame.querySelector('.door-front');

            if (openedDoors.includes(i)) {
                frame.classList.add('open');
            }

            front.addEventListener('click', () => {
                if (frame.classList.contains('locked') && !isBypassed) {
                    alert(`🔒 Pas encore ! La porte ${i} s'ouvrira le ${i} Décembre.`);
                    return;
                }

                if (!frame.classList.contains('open')) {
                    frame.classList.add('open');
                    
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 45, spread: 60, origin: { y: 0.7 },
                            colors: ['#ffd700', '#b30000', '#ffffff']
                        });
                    }

                    if (!openedDoors.includes(i)) {
                        openedDoors.push(i);
                        localStorage.setItem('opened_advent_doors', JSON.stringify(openedDoors));
                    }
                }
            });

            grid.appendChild(frame);
        }
    }

    // Gestion de l'animation au survol du rectangle du haut
    function setupHeaderAnimation() {
        const banner = document.getElementById('banner');
        const title = document.getElementById('header-title');
        const defaultText = "📅 CALENDRIER DE L'AVENT";
        
        const today = new Date();
        const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        const dateText = `📆 ${today.getDate()} ${months[today.getMonth()].toUpperCase()}`;

        let isAnimating = false;

        banner.addEventListener('mouseenter', () => {
            if (isAnimating) return;
            isAnimating = true;

            title.innerText = dateText;
            title.classList.add('flashing');

            // Arrête le clignotement après 2 secondes (4 cycles de 0.5s)
            setTimeout(() => {
                title.classList.remove('flashing');
            }, 2000);
        });

        banner.addEventListener('mouseleave', () => {
            title.innerText = defaultText;
            title.classList.remove('flashing');
            isAnimating = false;
        });
    }

    // Code Passe-partout : taper "christmas" débloque tout
    let secretInput = "";
    window.addEventListener('keydown', (e) => {
        secretInput += e.key.toLowerCase();
        if (secretInput.length > 15) secretInput = secretInput.slice(-15);

        if (secretInput.includes("christmas")) {
            isBypassed = true;
            secretInput = "";
            alert("🎄 Code 'christmas' activé ! Toutes les portes sont déverrouillées !");
            createCalendar();
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        createCalendar();
        setupHeaderAnimation();
    });
</script>
</body>
</html>
