<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent Magique</title>
    
    <!-- Supabase SDK & Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Poppins:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            /* BACKGROUND FIXE ET VISIBLE */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                              url('https://i.postimg.cc/PxR6NvbB/a2781225b39a14644c5673928f1b8f0b.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Poppins', sans-serif; overflow-x: hidden; color: #ffffff !important;
        }

        /* Canvas Chute de Neige */
        #snow-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        /* Vue principale du calendrier */
        #main-view {
            width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; padding: 20px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #main-view.hidden-view {
            opacity: 0; pointer-events: none; transform: scale(0.95);
        }

        /* Bannière supérieure */
        .header-banner {
            width: 98%; height: 110px;
            background-image: url('https://i.postimg.cc/Kc7F8rdr/53a6d70e-6093-4bdd-a3d0-3b43e8c70781-885x590.jpg');
            background-size: cover; background-position: center;
            border-radius: 20px; border: 3px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 20px rgba(255, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; cursor: pointer;
            z-index: 1; transition: transform 0.3s ease;
        }
        .header-banner:hover { transform: scale(1.01); }

        .header-title {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 12px 35px; border-radius: 40px;
            border: 2px solid #ffffff; color: #ffffff !important;
            font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 800;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9); text-align: center;
            transition: all 0.3s ease;
        }

        @keyframes flashAnim {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.05); color: #ffffff; text-shadow: 0 0 25px #ffffff; }
        }
        .header-title.flashing { animation: flashAnim 0.5s ease-in-out 4; }

        /* Section Admin */
        .admin-panel {
            display: none;
            width: 98%; margin-top: 10px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffffff;
            border-radius: 15px; padding: 12px 20px; color: #ffffff !important;
            align-items: center; justify-content: space-between;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); z-index: 1;
            flex-wrap: wrap; gap: 10px;
        }
        .admin-panel.visible { display: flex; }
        .admin-tag { font-weight: 700; color: #ffffff !important; font-size: 0.95rem; }
        .admin-btns { display: flex; gap: 10px; }
        .btn-admin {
            background: #800c19; color: #ffffff !important; border: 1px solid #ffffff;
            padding: 6px 14px; border-radius: 20px; font-weight: 600;
            font-size: 0.82rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-admin:hover { background: #b30000; transform: scale(1.04); }

        /* Conteneur du Calendrier Plein Écran */
        .calendar-container {
            margin-top: 15px; margin-bottom: 15px; width: 98%; flex-grow: 1;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 20px; border: 2.5px solid #ffffff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 15px rgba(255, 255, 255, 0.2); 
            padding: 18px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
            z-index: 1;
        }

        @media (max-width: 1024px) { .calendar-container { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 768px) {
            .calendar-container { grid-template-columns: repeat(3, 1fr); padding: 10px; gap: 8px; }
            .header-banner { height: 90px; }
            .header-title { font-size: 1.2rem; padding: 6px 15px; }
            .day-big-title { font-size: 4.5rem !important; }
        }
        @media (max-width: 480px) { 
            .calendar-container { grid-template-columns: repeat(2, 1fr); } 
            .day-big-title { font-size: 3.2rem !important; }
        }

        /* Portes du calendrier */
        .door-frame {
            position: relative; min-height: 100px; height: 100%; perspective: 1000px;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .door-frame:hover:not(.locked) {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(255, 255, 255, 0.4);
        }

        .door-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(17,17,17,0.9), rgba(34,34,34,0.9));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 6px; border-radius: 12px; border: 1.5px solid #ffffff;
            cursor: pointer;
        }

        .door-content .day-label-opened {
            font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 800; color: #ffffff !important;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .door-front {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #800c19, #b30000);
            border: 2px solid #ffffff; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff !important; font-family: 'Cinzel', serif; cursor: pointer;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
            z-index: 2;
        }
        
        .door-front .day-title {
            font-size: 1.3rem; font-weight: 800; letter-spacing: 1px; color: #ffffff !important;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.7);
        }

        .door-front::after {
            content: "✨"; position: absolute; bottom: 4px; right: 6px; font-size: 0.8rem; opacity: 0.8;
        }

        .door-frame.open .door-front {
            transform: rotateY(-160deg) scaleX(0.85);
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .door-frame.locked .door-front {
            background: linear-gradient(135deg, #2b2b2b, #151515);
            border-color: #888888; cursor: not-allowed; opacity: 0.85;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .door-frame.shake { animation: shake 0.4s ease; }

        .btn-back {
            margin-bottom: 10px; padding: 12px 35px; border-radius: 30px;
            background: linear-gradient(135deg, #ffffff, #dddddd);
            color: #000000; border: 2px solid #ffffff; font-size: 1rem; font-weight: 800;
            cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: all 0.3s ease;
            z-index: 1;
        }
        .btn-back:hover { transform: translateY(-3px) scale(1.05); background: #ffffff; }

        /* OVERLAY TRANSLUCIDE (OPACITÉ À 45% + PREMIER PLAN POUR LE TEXTE) */
        #day-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
            z-index: 200; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }

        #day-overlay.active { opacity: 1; pointer-events: auto; }

        .day-spawn-card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transform: scale(0.3); transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #day-overlay.active .day-spawn-card { transform: scale(1); }

        /* TEXTE DU JOUR EN BLANC PUR ET TRÈS GROS */
        .day-big-title {
            font-family: 'Cinzel', serif; font-size: 8.5rem; font-weight: 900;
            color: #ffffff !important; 
            text-shadow: 0 0 35px rgba(255, 255, 255, 1), 0 8px 25px rgba(0,0,0,0.9);
            margin: 0; letter-spacing: 3px;
        }

        .day-sub-date {
            font-size: 2.2rem; font-weight: 800; color: #ffffff !important;
            margin-top: 10px; margin-bottom: 40px; letter-spacing: 2px;
            text-transform: uppercase; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 4px 10px rgba(0,0,0,0.8);
        }

        .btn-action-day {
            background: linear-gradient(135deg, #800c19, #e60000);
            color: #ffffff !important; border: 3px solid #ffffff; padding: 20px 45px;
            border-radius: 50px; font-size: 1.35rem; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 30px rgba(230, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease; animation: pulseBtn 2s infinite;
        }

        .btn-action-day:hover {
            transform: scale(1.08); box-shadow: 0 15px 40px rgba(230, 0, 0, 0.9), 0 0 30px rgba(255, 255, 255, 0.9);
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .btn-close-overlay {
            position: absolute; top: 25px; right: 35px;
            background: rgba(255, 255, 255, 0.15); border: 1.5px solid #ffffff;
            color: #ffffff !important; width: 50px; height: 50px; border-radius: 50%;
            font-size: 1.5rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-close-overlay:hover { background: rgba(255, 255, 255, 0.35); transform: rotate(90deg); }

        /* Modal simple de verrouillage */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            z-index: 300;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            border: 2.5px solid #ffffff; border-radius: 20px;
            padding: 30px; text-align: center; max-width: 420px; width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(255, 255, 255, 0.3);
            color: #ffffff !important;
        }
        .modal-title { font-family: 'Cinzel', serif; font-size: 1.6rem; color: #ffffff !important; margin-bottom: 12px; font-weight: 800; }
        .modal-text { font-size: 1rem; color: #dddddd; font-weight: 600; margin-bottom: 25px; }
        .modal-btn {
            background: linear-gradient(135deg, #800c19, #b30000);
            color: #ffffff !important; border: 1.5px solid #ffffff; padding: 12px 30px;
            border-radius: 25px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Canvas Neige -->
    <canvas id="snow-canvas"></canvas>

    <!-- Vue Principale -->
    <div id="main-view">
        <div class="header-banner" id="banner">
            <div class="header-title" id="header-title">📅 CALENDRIER DE L'AVENT</div>
        </div>

        <div class="admin-panel" id="admin-panel">
            <div class="admin-tag">👑 MODO / ADMIN : <span id="admin-email">asselinj24@emm.qc.ca</span></div>
            <div class="admin-btns">
                <button class="btn-admin" onclick="toggleBypass()">🔓 Activer/Désactiver Bypass</button>
                <button class="btn-admin" onclick="resetProgress()">🔄 Réinitialiser la progression</button>
            </div>
        </div>

        <div class="calendar-container" id="calendar-grid"></div>

        <button class="btn-back" onclick="window.location.href='index.html'">⬅️ RETOUR AU MENU</button>
    </div>

    <!-- Vue Écran Géant (Spawn Jour + Redirection) -->
    <div id="day-overlay">
        <button class="btn-close-overlay" onclick="closeDayOverlay()">✕</button>
        <div class="day-spawn-card">
            <h1 class="day-big-title" id="spawn-title">JOUR 1</h1>
            <div class="day-sub-date" id="spawn-date">1 DÉCEMBRE</div>
            <button class="btn-action-day" id="spawn-btn" onclick="goToDayPage()">ACCÉDER AUX QUESTIONS DU JOUR 1 ➔</button>
        </div>
    </div>

    <!-- Modal d'avertissement -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="modal-title">🔒 Porte Verrouillée</div>
            <div class="modal-text" id="modal-text">Patience ! Cette porte n'est pas encore disponible.</div>
            <button class="modal-btn" onclick="closeModal()">COMPRIS</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://frwxwmynjgzbjwwjxscp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyd3h3bXluamd6Ymp3d2p4c2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDQ4OTUsImV4cCI6MjEwMDcyMDg5NX0.2Ps0PvrEu0xqyfN1UjAZ2qcPBEZ-ilMYjApi91omQCA';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const ADMIN_EMAILS = ["asselinj24@emm.qc.ca"];
    let currentUserEmail = "";
    let isBypassed = false;
    let openedDoors = [];
    let currentSelectedDay = 1;

    async function loadUserProgress() {
        if (!supabaseClient) return;
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                currentUserEmail = session.user.email.toLowerCase();
            } else {
                currentUserEmail = localStorage.getItem('last_active_email') || "guest@local";
            }

            if (ADMIN_EMAILS.includes(currentUserEmail)) {
                isBypassed = true;
                document.getElementById('admin-panel').classList.add('visible');
                document.getElementById('admin-email').innerText = currentUserEmail;
            }

            const { data } = await supabaseClient
                .from('advent_progress')
                .select('opened_doors')
                .eq('email', currentUserEmail)
                .maybeSingle();

            if (data && data.opened_doors) {
                openedDoors = data.opened_doors;
            } else {
                openedDoors = JSON.parse(localStorage.getItem(`advent_doors_${currentUserEmail}`) || "[]");
            }
        } catch (e) {
            console.error(e);
            openedDoors = JSON.parse(localStorage.getItem(`advent_doors_guest@local`) || "[]");
        }

        createCalendar();
    }

    async function saveUserProgress(doorIndex) {
        if (!openedDoors.includes(doorIndex)) {
            openedDoors.push(doorIndex);
        }

        localStorage.setItem(`advent_doors_${currentUserEmail}`, JSON.stringify(openedDoors));

        if (supabaseClient && currentUserEmail) {
            await supabaseClient
                .from('advent_progress')
                .upsert({
                    email: currentUserEmail,
                    opened_doors: openedDoors,
                    updated_at: new Date()
                }, { onConflict: 'email' });
        }
    }

    function createCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const today = new Date();
        const currentMonth = today.getMonth(); // 11 = Décembre
        const currentDay = today.getDate();

        for (let i = 1; i <= 25; i++) {
            const frame = document.createElement('div');
            frame.className = 'door-frame';

            const isAvailable = isBypassed || (currentMonth === 11 && i <= currentDay) || currentMonth > 11;

            if (!isAvailable) {
                frame.classList.add('locked');
            }

            frame.innerHTML = `
                <div class="door-content" id="content-${i}">
                    <div class="day-label-opened">JOUR ${i}</div>
                </div>
                <div class="door-front">
                    <div class="day-title">JOUR ${i}</div>
                </div>
            `;

            const front = frame.querySelector('.door-front');
            const content = frame.querySelector('.door-content');

            if (openedDoors.includes(i)) {
                frame.classList.add('open');
            }

            // Événement pour ouvrir une nouvelle case
            front.addEventListener('click', () => {
                if (frame.classList.contains('locked') && !isBypassed) {
                    frame.classList.add('shake');
                    setTimeout(() => frame.classList.remove('shake'), 400);
                    showModal('🔒 Porte Verrouillée', `Patience ! La porte du Jour ${i} s'ouvrira le ${i} Décembre.`);
                    return;
                }

                if (!frame.classList.contains('open')) {
                    frame.classList.add('open');
                    saveUserProgress(i);
                }
                
                openDayOverlay(i);
            });

            // Événement pour retourner sur une case DÉJÀ ouverte
            content.addEventListener('click', () => {
                if (frame.classList.contains('open')) {
                    openDayOverlay(i);
                }
            });

            grid.appendChild(frame);
        }
    }

    /* VUE PLEIN ÉCRAN POUR LE JOUR */
    function openDayOverlay(dayNumber) {
        currentSelectedDay = dayNumber;
        
        document.getElementById('spawn-title').innerText = `JOUR ${dayNumber}`;
        document.getElementById('spawn-date').innerText = `${dayNumber} DÉCEMBRE`;
        document.getElementById('spawn-btn').innerText = `ACCÉDER AUX QUESTIONS DU JOUR ${dayNumber} ➔`;

        document.getElementById('main-view').classList.add('hidden-view');

        setTimeout(() => {
            document.getElementById('day-overlay').classList.add('active');
            triggerUniqueConfetti(dayNumber);
        }, 300);
    }

    function closeDayOverlay() {
        document.getElementById('day-overlay').classList.remove('active');
        setTimeout(() => {
            document.getElementById('main-view').classList.remove('hidden-view');
        }, 300);
    }

    function goToDayPage() {
        window.location.href = `December${currentSelectedDay}.html`;
    }

    /* ANIMATIONS DE CONFETTIS AU PREMIER PLAN (Z-INDEX SUPERIEUR) */
    function triggerUniqueConfetti(day) {
        if (typeof confetti !== 'function') return;

        const duration = 10 * 1000; // 10 secondes
        const animationEnd = Date.now() + duration;

        const interval = setInterval(() => {
            const timeLeft = animationEnd - Date.now();

            if (timeLeft <= 0) {
                return clearInterval(interval);
            }

            // Options par défaut pour mettre les confettis tout devant
            const defaultOptions = {
                zIndex: 999999
            };

            switch (day % 5) {
                case 1:
                    confetti({ ...defaultOptions, particleCount: 15, spread: 80, origin: { y: 0.6 }, colors: ['#ffffff', '#ff0000', '#ffd700'] });
                    break;
                case 2:
                    confetti({ ...defaultOptions, particleCount: 10, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ ...defaultOptions, particleCount: 10, angle: 120, spread: 55, origin: { x: 1 } });
                    break;
                case 3:
                    confetti({ ...defaultOptions, particleCount: 20, spread: 100, startVelocity: 30, origin: { y: 0.8 }, colors: ['#00ffcc', '#ffffff', '#ff00ff'] });
                    break;
                case 4:
                    confetti({ ...defaultOptions, particleCount: 15, scalar: 1.2, shapes: ['circle'], origin: { x: Math.random(), y: Math.random() - 0.2 } });
                    break;
                case 0:
                    confetti({ ...defaultOptions, particleCount: 15, scalar: 1.5, shapes: ['star'], colors: ['#ffffff', '#ffd700', '#ffae00'] });
                    break;
            }
        }, 250);
    }

    /* Actions Admin & Modals */
    function toggleBypass() {
        isBypassed = !isBypassed;
        showModal('Mode Admin', `Mode Bypass ${isBypassed ? "ACTIVÉ 🔓" : "DÉSACTIVÉ 🔒"}`);
        createCalendar();
    }

    async function resetProgress() {
        if (!confirm("Voulez-vous vraiment réinitialiser toutes les portes ouvertes ?")) return;
        openedDoors = [];
        localStorage.removeItem(`advent_doors_${currentUserEmail}`);

        if (supabaseClient && currentUserEmail) {
            await supabaseClient
                .from('advent_progress')
                .upsert({ email: currentUserEmail, opened_doors: [], updated_at: new Date() });
        }

        showModal('Réinitialisation', 'Toutes les portes sont refermées !');
        createCalendar();
    }

    function showModal(title, text) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = text;
        document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('active');
    }

    function setupHeaderAnimation() {
        const banner = document.getElementById('banner');
        const title = document.getElementById('header-title');
        const defaultText = "📅 CALENDRIER DE L'AVENT";
        
        const today = new Date();
        const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        const dateText = `📆 ${today.getDate()} ${months[today.getMonth()].toUpperCase()}`;

        let isAnimating = false;

        banner.addEventListener('mouseenter', () => {
            if (isAnimating) return;
            isAnimating = true;
            title.innerText = dateText;
            title.classList.add('flashing');
            setTimeout(() => title.classList.remove('flashing'), 2000);
        });

        banner.addEventListener('mouseleave', () => {
            title.innerText = defaultText;
            title.classList.remove('flashing');
            isAnimating = false;
        });
    }

    /* Bypass Clavier "christmas" */
    let secretInput = "";
    window.addEventListener('keydown', (e) => {
        secretInput += e.key.toLowerCase();
        if (secretInput.length > 15) secretInput = secretInput.slice(-15);

        if (secretInput.includes("christmas")) {
            isBypassed = true;
            secretInput = "";
            document.getElementById('admin-panel').classList.add('visible');
            showModal("🎄 Code Secret Activé !", "Toutes les portes du calendrier sont déverrouillées !");
            createCalendar();
        }
    });

    /* Neige Animée */
    function initSnow() {
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const flakes = Array.from({ length: 75 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 3 + 1,
            d: Math.random() * 1 + 0.5
        }));

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.beginPath();
            for (let f of flakes) {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            update();
            requestAnimationFrame(draw);
        }

        function update() {
            for (let f of flakes) {
                f.y += Math.cos(f.d) + 1 + f.r / 2;
                f.x += Math.sin(f.d) * 0.5;
                if (f.y > canvas.height) {
                    f.y = -10;
                    f.x = Math.random() * canvas.width;
                }
            }
        }
        draw();
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadUserProgress();
        setupHeaderAnimation();
        initSnow();
    });
</script>
</body>
</html>
