<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier de l'Avent 🎄</title>

  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    
    body, html {
      margin: 0; padding: 0; min-height: 100vh;
      background: radial-gradient(circle at top center, #1b2838 0%, #0a0f18 100%);
      font-family: 'Poppins', sans-serif; color: #ffffff;
      display: flex; flex-direction: column; align-items: center; padding: 20px;
      overflow-x: hidden; position: relative;
    }

    /* Effet de neige Canvas en arrière-plan */
    #snow-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 1;
    }

    header {
      width: 100%; max-width: 1000px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; z-index: 2; flex-wrap: wrap; gap: 15px;
    }

    .btn-nav-back {
      background: linear-gradient(135deg, #d4a017, #f1c40f);
      color: #1a0f07; border: none; padding: 12px 26px;
      border-radius: 30px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 160, 23, 0.4); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-nav-back:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
    }

    h1.page-title {
      font-family: 'Cinzel', serif; font-size: 2.5rem; color: #ffd700; margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5), 0 0 20px rgba(255, 215, 0, 0.6);
      text-align: center;
    }

    .calendar-container {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px);
      border: 1.5px solid rgba(255, 215, 0, 0.25); border-radius: 28px;
      padding: 35px; max-width: 1000px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 215, 0, 0.05);
      z-index: 2; margin-bottom: 30px;
    }

    .calendar-subtitle {
      font-size: 1.05rem; color: #cbd5e1; margin-bottom: 30px; font-weight: 300;
    }

    /* Grille du calendrier */
    .advent-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;
    }
    @media (max-width: 900px) { .advent-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 600px) { .advent-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 420px) { .advent-grid { grid-template-columns: repeat(2, 1fr); } }

    /* CONTENEUR DE LA PORTE 3D */
    .door-wrapper {
      perspective: 1000px;
      height: 110px;
      cursor: pointer;
    }

    .door-card {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 18px;
    }

    /* BATTANT DE LA PORTE (Face avant) */
    .door-front {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden;
      background: linear-gradient(135deg, rgba(185, 28, 28, 0.95), rgba(127, 29, 29, 0.95));
      border: 2px solid #ffd700; border-radius: 18px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-size: 28px; font-weight: 800; font-family: 'Cinzel', serif; color: #ffffff;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4), inset 0 0 10px rgba(255, 215, 0, 0.2);
      transform-origin: left;
      transition: all 0.4s ease;
      z-index: 2;
    }

    .door-wrapper:hover .door-front:not(.locked) {
      background: linear-gradient(135deg, #ffd700, #d4a017); color: #1a0f07;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
    }

    /* INTERIEUR DE LA CASE (Révélation) */
    .door-back {
      position: absolute; width: 100%; height: 100%;
      background: radial-gradient(circle, #2d3748, #1a202c);
      border: 1.5px dashed #ffd700; border-radius: 18px;
      display: flex; justify-content: center; align-items: center;
      font-size: 32px;
      z-index: 1;
    }

    /* ETAT VERROUILLÉ */
    .door-front.locked {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(148, 163, 184, 0.4);
      color: #64748b;
    }
    .door-front.locked::after {
      content: '🔒'; font-size: 14px; margin-top: 4px;
    }

    /* ANIMATION D'OUVERTURE DE PORTE 3D */
    .door-wrapper.open .door-front {
      transform: rotateY(-110deg);
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <canvas id="snow-canvas"></canvas>

  <header>
    <a href="index.html" class="btn-nav-back">⬅️ Menu Principal</a>
    <h1 class="page-title">🎅 Calendrier de l'Avent</h1>
    <div style="width: 140px;"></div>
  </header>

  <div class="calendar-container">
    <p class="calendar-subtitle">Clique sur une porte pour découvrir la surprise du jour ! 🎁</p>
    <div id="advent-grid" class="advent-grid"></div>
  </div>

  <script>
    const UNLOCK_PASSWORD = "christmas";
    let unlockedByPassword = {};

    function renderAdventGrid() {
      const grid = document.getElementById('advent-grid');
      grid.innerHTML = '';
      const today = new Date();
      const currentMonth = today.getMonth(); // 11 = Décembre
      const currentDayNum = today.getDate();

      // De 1 à 25 Décembre
      for (let i = 1; i <= 25; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'door-wrapper';
        wrapper.id = `door-wrapper-${i}`;

        const card = document.createElement('div');
        card.className = 'door-card';

        // Intérieur de la porte (Surprise cachée)
        const back = document.createElement('div');
        back.className = 'door-back';
        back.innerText = '✨';

        // Face de la porte
        const front = document.createElement('div');
        front.className = 'door-front';
        front.innerText = i;

        // Condition de déverrouillage (Jour passé/actuel ou mot de passe)
        const isFuture = (currentMonth === 11 && i > currentDayNum) || currentMonth !== 11;
        const isUnlockedByPass = unlockedByPassword[i] === true;

        if (isFuture && !isUnlockedByPass) {
          front.classList.add('locked');
          wrapper.onclick = () => handleLockedDayClick(i);
        } else {
          wrapper.onclick = () => triggerDoorOpen(i);
        }

        card.appendChild(back);
        card.appendChild(front);
        wrapper.appendChild(card);
        grid.appendChild(wrapper);
      }
    }

    function handleLockedDayClick(day) {
      const input = prompt(`🔒 Jour ${day} verrouillé !\nMot de passe pour tester en avance :`);
      if (input !== null && input.trim().toLowerCase() === UNLOCK_PASSWORD) {
        unlockedByPassword[day] = true;
        renderAdventGrid();
        triggerDoorOpen(day);
      } else if (input !== null) {
        alert("❌ Mot de passe incorrect !");
      }
    }

    // ANIMATION ET REDIRECTION VERS DÉCEMBRE X
    function triggerDoorOpen(day) {
      const doorWrapper = document.getElementById(`door-wrapper-${day}`);
      
      if (!doorWrapper.classList.contains('open')) {
        // Déclenche l'animation d'ouverture 3D
        doorWrapper.classList.add('open');

        // Confettis légers
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.7 }
          });
        }

        // Redirection fluide vers la page GitHub (December1.html, December2.html, etc.)
        setTimeout(() => {
          window.location.href = `December${day}.html`;
        }, 900); // 900ms pour laisser l'animation de porte se terminer
      }
    }

    /* ---- EFFET DE NEIGE DYNAMIQUE CANVAS ---- */
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const flakes = Array.from({ length: 65 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 3 + 1,
      speed: Math.random() * 1 + 0.5,
      wind: Math.random() * 0.5 - 0.25
    }));

    function animateSnow() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      
      flakes.forEach(f => {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        f.y += f.speed;
        f.x += f.wind;
        if (f.y > height) f.y = -5;
        if (f.x > width) f.x = 0;
        if (f.x < 0) f.x = width;
      });

      ctx.fill();
      requestAnimationFrame(animateSnow);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAdventGrid();
      animateSnow();
    });
  </script>
</body>
</html>
